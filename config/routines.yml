# routines.yml — Agent routines registry.
# Each routine is enforced by default (enforce: hard) unless bypassed at runtime.
#
# IMPORTANT — what "enforce: hard" actually means (#119): for `mechanism: agent-rule` routines,
# "hard" means the action text is ALWAYS injected as context at SessionStart via
# .agents/rules/routines.generated.md — it is NOT mechanically blocked or validated by the
# harness. The agent is instructed to follow it, but nothing prevents the agent from ignoring
# it short of its own compliance. Only `mechanism: hook` routines that are wired through an
# actual blocking hook (e.g. guard-git.sh) can mechanically prevent an action. Read "hard" as
# "always-injected / expected-to-follow", not "impossible to bypass without the CLI bypass
# command" — the bypass command just stops the text from being injected in the first place.
#
# ACTION TEXT IS A PER-SESSION TOKEN COST. Every enabled agent-rule action is injected into
# every session, so `action:` is written terse on purpose: commands, paths, flags and issue
# refs verbatim, prose stripped. Keep it that way when editing.
#
# To bypass a routine without editing this file:
#   node tools/routines.js bypass <id> [--session]
#   node tools/routines.js unbypass <id>
#
# Mechanisms:
#   agent-rule — compiled into .agents/rules/routines.generated.md (injected at SessionStart)
#   hook       — enforced by hooks/routine-dispatch.js at runtime (no settings.json edit needed)
#   cron       — a job in .github/workflows/scheduled-tasks.yml; see the NOTE below
#   external   — runs on a platform this repo does not control (e.g. Grok Tasks). Nothing here can
#                enforce it, so it must not be `enforce: hard` and it is exempt from cron verify.
#
# To add a new routine: add an entry here, then run: node tools/routines.js compile

- id: always-worktree
  description: Feature work runs in an isolated git worktree
  trigger: feature_work
  mechanism: agent-rule
  enforce: hard
  enabled: true
  action: "Feature work: create or enter a git worktree first (superpowers:using-git-worktrees skill). Never feature-work directly on the main branch clone."

- id: fix-pr-until-green
  description: Do not declare done until PR CI checks pass and all review threads are resolved
  trigger: pr_open
  mechanism: agent-rule
  enforce: hard
  enabled: true
  action: "After opening a PR, not DONE until `node tools/pr-guard.js <pr-number>` passes: all CI checks green, all review threads resolved."

- id: auto-resolve-pr-comments
  description: 2-3 minutes after PR creation, respond to any review comments
  trigger: pr_create
  mechanism: hook
  enforce: hard
  enabled: true
  action: "When a PR is created (PostToolUse: gh pr create), schedule a one-shot job (~+2min) that responds to any open review comments on that PR."

- id: identity-query-inline
  description: Answer identity/lookup queries inline from graph-query, never spawn Jarvis
  trigger: identity_lookup
  mechanism: agent-rule
  enforce: hard
  enabled: true
  action: "Identity/memory queries (who am I, what do you know about me, my preferences): answer INLINE via `node ~/dev/AgentSystem/tools/graph/graph-query.js personal-brain <keywords> --brain-path=~/agent-memory/nexus/personal-brain --record-access`. Never spawn an agent — ~110 tokens vs 47k."

- id: memory-write-back
  description: Agents self-capture durable facts to memory the moment they judge them relevant
  trigger: durable_fact_learned
  mechanism: agent-rule
  enforce: hard
  enabled: true
  action: "Learned a durable fact (user preference, decision, correction, stable project/company context, reusable pattern)? Persist immediately, do not wait for session end: `node ~/dev/AgentSystem/tools/brain-remember.js --fact=\"<fact>\" [--tier=repo --target=<slug> | --tier=agent --target=<name>]`. Tiers: personal (default) = about the user; repo:<slug> = technical/business fact about ONE repo (slugs in ~/agent-memory/nexus/known-repos.json; match what the repo IS, e.g. genie=product UI vs genie-brain=Arbor Genie backend); agent:<name> = pattern about one agent. Durable + specific only; skip one-off details and speculation. Dedup automatic. Stop-hook memory-capture.js sweeps as backup."

- id: teach-the-swarm
  description: "[META] A prompt-match routine can teach new swarm behavior. Disabled example."
  trigger: prompt_match
  mechanism: agent-rule
  enforce: hard
  enabled: false
  match_pattern: "security audit .*PR"
  action: "When prompt matches 'security audit <PR>', spawn Sam (security agent) with: claude @sam --pr=<PR-number>. This demonstrates the prompt-match → swarm-spawn pattern. To add a new swarm behavior: add a routine with trigger=prompt_match and match_pattern=<your regex>, set mechanism=agent-rule, and describe the swarm spawn in action."

- id: post-merge-cleanup
  description: After a PR merges, close its linked issue and confirm the branch was deleted
  trigger: pr_merge
  mechanism: agent-rule
  enforce: hard
  enabled: true
  action: "After `gh pr merge`: confirm the linked issue is closed (`gh issue close <N>` with a comment referencing the PR) and the source branch is deleted (`--delete-branch`, or `gh api` if missed). Leave no merged branches or linked-but-open issues."

- id: verify-before-close
  description: Never close an issue without a landed commit/PR reference
  trigger: issue_close
  mechanism: agent-rule
  enforce: hard
  enabled: true
  action: "Before closing any GitHub issue, verify the fix landed: `node ~/dev/AgentSystem/tools/issue-close.js <n> --commit <sha>` (checks the commit is reachable from origin/main via `git merge-base --is-ancestor`, then closes with a reference comment). Never bare `gh issue close` for fix-type issues — closed-without-landed-commit caused a full re-audit (#151)."

# NOTE on cron-mechanism routines: `mechanism: cron` entries are NOT injected into sessions — they
# document jobs defined in .github/workflows/scheduled-tasks.yml, which run on the self-hosted
# Linux runner. Change a cron entry here and you must change that workflow too.
#
# `node tools/routines.js verify` (or `compile --verify`) now cross-checks both directions of that
# contract — the job exists, and its cron expression matches — and exits 1 when it does not. Add
# `workflow_job:` when the job name differs from the routine id. This check exists because four
# `enforce: hard` cron routines sat unregistered for weeks while `compile` printed "register via
# Task Scheduler manually or via setup-scheduled-tasks.ps1" on a Linux host (#200). The compile
# step lying about enforcement was the defect; the dead routines were the symptom.

# Enabled, and it costs money: the `weekly-agent-review` job in scheduled-tasks.yml is a real
# headless Jarvis run, roughly one unattended opus session a week. That was the open question that
# kept this routine disabled — the mechanics were never the hard part, the spending call was — and
# it is now a deliberate yes. A fixed script was the cheaper option and was rejected: session-cost
# and routing-report already print the numbers, and the numbers are not the review.
#
# The job's own deliverable check is what keeps this honest. It fails when no decision record was
# written for the day, so "the model ran and said something agreeable" cannot pass as a review.
- id: weekly-agent-review
  description: Saturday agent fleet review (routing misroutes, session costs, blockers, goals)
  trigger: schedule
  mechanism: cron
  schedule: "0 9 * * 6"
  task_name: AgentSystem-WeeklyAgentReview
  enforce: hard
  enabled: true
  action: "Weekly agent review runs unattended (Sat 09:00 UTC, `weekly-agent-review` job): headless Jarvis reviews routing misroutes, session costs, open blockers and goals, then writes one decision record. Read it via `node ~/dev/AgentSystem/tools/decision-log.js --list`; do not run it by hand."

- id: weekly-brain-review
  description: Monday brain consolidation (full memory sleep cycle + reflection)
  trigger: schedule
  mechanism: cron
  workflow_job: weekly-brain-consolidation
  schedule: "0 8 * * 1"
  task_name: AgentSystem-WeeklyBrainConsolidation
  enforce: hard
  enabled: true
  action: "Weekly brain review: run node ~/dev/AgentSystem/tools/memory-maintenance.js --reflect — full sleep cycle (split/reconsolidate/decay/stale-prune/consolidate/seed + reflection). Supersedes the old personal-brain-split.js + memory-stale.js two-step, which memory-maintenance.js now wraps."

- id: weekly-memory-decay
  description: Sunday visit_count decay across personal-brain and agentsystem graphs
  trigger: schedule
  mechanism: cron
  workflow_job: weekly-memory-decay
  schedule: "0 0 * * 0"
  task_name: AgentSystem-WeeklyMemoryDecay
  enforce: hard
  enabled: true
  action: "Weekly memory decay: node ~/dev/AgentSystem/tools/memory-decay.js --brain=agentsystem then --brain=personal-brain. Keeps BM25 retrieval weights fresh by decaying stale visit counts."

- id: weekly-trust-scores
  description: Sunday trust-score aggregation from agent-dispatch run logs
  trigger: schedule
  mechanism: cron
  workflow_job: weekly-trust-scores
  # Sunday 00:00, matching the `weekly-trust-scores` job in scheduled-tasks.yml. This said
  # "0 8 * * 6" (Saturday 08:00) while the workflow ran it Sunday midnight — `routines.js compile
  # --verify` now fails on exactly that kind of mismatch.
  schedule: "0 0 * * 0"
  task_name: AgentSystem-WeeklyTrustScores
  enforce: hard
  enabled: true
  action: "Weekly trust scores: node ~/dev/AgentSystem/tools/compute-trust-scores.js — aggregates ~/agent-memory/nexus/run-log/*.json into trust-scores.md (read by leads before delegation)."

- id: enforcement-drift-check
  description: Daily enforcement drift check (hooks, agents, routines) — alerts on mismatch
  trigger: schedule
  mechanism: cron
  workflow_job: enforcement-drift-check
  schedule: "0 3 * * *"
  task_name: AgentSystem-EnforcementDriftCheck
  enforce: hard
  enabled: true
  action: "Enforcement drift check runs daily (03:00 UTC). Three --check tools verify repo vs deployed state: `node tools/deploy-hooks.js --check` (hook deploy+registration), `node tools/sync-agents.js --check` (installed agent defs), `node tools/routines.js verify` (orphan hard cron routines). Raises `enforcement-drift` human-needed alert on any failure, resolves on success. See .github/workflows/scheduled-tasks.yml enforcement-drift-check job."

# ── Life OS daily cadence: two stages, one of which is not ours ────────────────────────────────
#
# STAGE 1 (06:00) runs in Grok Tasks, external to this repo and this host — it is `mechanism:
# external`, not `cron`, precisely so `compile --verify` does not look for a workflow job that will
# never exist. It owns mail and calendar and archives a brief with a machine-readable `handoff:`
# block. This entry documents the contract stage 2 depends on; changing it means changing
# skills/daily-briefing/portable-prompt.md, which is what Grok actually runs.
#
# STAGE 2 runs twice daily (13:00 and 05:00 UTC = 06:00 and 22:00 Pacific): the `daily-triage`
# job in scheduled-tasks.yml.
- id: daily-briefing
  description: Stage 1 (06:00, external Grok Tasks) — mail + calendar triage, brief archived to Drive and disk
  trigger: schedule
  mechanism: external
  schedule: "0 6 * * *"
  task_name: GrokTasks-DailyBriefing
  # `soft`, not `hard`: nothing in this repo can enforce a job running on someone else's platform.
  # Claiming otherwise is the exact "reports as enforced, cannot fire" defect from #200/#204.
  # Stage 2 detects a missing or stale brief and falls back, so a missed stage 1 degrades.
  enforce: soft
  enabled: true
  action: "Stage 1 is a Grok Task, not a local cron — nothing here launches it. Prompt: skills/daily-briefing/portable-prompt.md. Its step 5 chains the Sunday weekly + last-day monthly roll-ups, so there are no separate weekly/monthly crons. Brief goes to Drive `Life OS/briefings/YYYY-MM-DD` AND ${LIFE_REPO:-$HOME/life}/briefings/YYYY-MM-DD.md — the exact name MC's /briefing tab serves and stage 2 reads."

- id: daily-triage
  description: Stage 2 — twice daily (06:00 and 22:00 Pacific): read stage 1's handoff, cover chat/GitHub, execute AI-actionable items as draft PRs, draft outbound, write the closeout
  trigger: schedule
  mechanism: cron
  workflow_job: daily-triage
  # Two crons, both required to exist — `verify` checks every entry in this list. 13:00 UTC = 06:00
  # PDT, 05:00 UTC = 22:00 PDT (the previous Pacific day). UTC-only and DST-blind, so these become
  # 05:00 and 21:00 Pacific in winter.
  schedule: "0 13 * * *, 0 5 * * *"
  task_name: AgentSystem-DailyTriage
  enforce: hard
  enabled: true
  action: "Life OS stage 2 as Jarvis: follow ~/dev/AgentSystem/skills/daily-triage/SKILL.md (gitignored, local copy only). Draft PRs only, never merge, never push to main, never send mail. Verify preconditions first with `node ~/dev/AgentSystem/tools/life-os-doctor.js`; blocking gaps raise a `human-needed` issue instead of failing silently. Must write ${LIFE_REPO:-$HOME/life}/closeouts/YYYY-MM-DD.md — the workflow fails the run without it."
