# #154: every job below reads or writes local-machine state that only exists on the
# self-hosted runner's host (~/agent-memory/nexus/*, ~/.claude) — none of it is portable to a
# GitHub-hosted runner, so none of these jobs can be migrated to ubuntu-latest. When the
# self-hosted runner is offline these jobs simply never start (no failure signal on their own);
# `.github/workflows/runner-health-check.yml` runs on ubuntu-latest specifically to detect that
# condition from outside and open/update a `runner:down` tracking issue, which is the loud-failure
# signal for this whole file.
#
# #164: pr-auto-review (cavecrew reviewer) job removed. friday-audit.yml is now the single
# engineering reviewer on every PR; sam-audit.yml remains the security gate.
#
# Runner is the Linux self-hosted runner co-located with Mission Control
# (tools/mission-control/install-runner.sh). Steps run under bash; the default
# self-hosted,Linux,X64 labels satisfy `runs-on: [self-hosted, Linux]`.
name: Scheduled Tasks

on:
  schedule:
    # weekly-brain-consolidation: Monday 8am UTC
    - cron: '0 8 * * 1'
    # weekly-memory-decay + weekly-trust-scores + weekly-hygiene: Sunday midnight UTC
    - cron: '0 0 * * 0'
    # enforcement-drift-check: daily 3am UTC
    - cron: '0 3 * * *'
    # daily-triage (Life OS stage 2): TWICE daily, anchored to Pacific.
    #   13:00 UTC = 06:00 PDT (morning run)
    #   05:00 UTC = 22:00 PDT (evening run, the PREVIOUS Pacific day)
    # GitHub cron is UTC-only and DST-blind, so in winter (PST, UTC-8) these land at 05:00 and 21:00
    # Pacific instead. Shift both by an hour in November and March if that matters.
    #
    # Both runs fall on the SAME UTC date — 22:00 PDT is 05:00 UTC the next morning — so they share a
    # closeout filename. STEP 6 of the skill appends a run section rather than overwriting, because
    # Mission Control's /briefing filter is strictly /^\d{4}-\d{2}-\d{2}\.md$/ and would not see a
    # slot-suffixed file at all.
    - cron: '0 13 * * *'
    - cron: '0 5 * * *'
    # weekly-agent-review: Saturday 9am UTC
    - cron: '0 9 * * 6'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: false
        default: daily-triage
        type: choice
        options:
          - daily-triage
          - weekly-agent-review
          - enforcement-drift-check

jobs:
  # Enforcement drift check — verify repo vs deployed state consistency.
  # Runs daily to catch hook/agent/routine deploy drift early, before it causes outages.
  # Raises human-needed alert on any drift detected, resolves on clean runs.
  enforcement-drift-check:
    # Dispatchable as well as scheduled: a check that can only fire at 03:00 UTC cannot be proven
    # to work, and this one shipped unrun. `gh workflow run scheduled-tasks.yml -f
    # job=enforcement-drift-check` exercises it on demand. The `job` input still defaults to
    # daily-triage, so a bare dispatch behaves exactly as before.
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'enforcement-drift-check')
    runs-on: [self-hosted, Linux]
    # GH_TOKEN deliberately unset — see the #gh-token-shadow note on daily-triage. `gh` falls
    # through to the runner's own hosts.yml PAT, which is what human-needed.js needs to write.
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve gh/node absolute paths for runner service context
        id: tools
        shell: bash
        run: |
          resolve() {
            local name="$1"; shift
            local c
            for c in "$@"; do [ -x "$c" ] && { echo "$c"; return; }; done
            command -v "$name" 2>/dev/null || true
          }
          NODE_PATH=$(resolve node "$HOME/.nvm/versions/node/*/bin/node" /usr/bin/node /usr/local/bin/node)
          echo "Resolved node: $NODE_PATH"
          echo "node_path=$NODE_PATH" >> "$GITHUB_OUTPUT"

      - name: Run enforcement drift checks
        id: drift
        shell: bash
        run: |
          set +e
          driftFound=0
          results=""

          echo "=== Checking hook deploy + registration drift ==="
          if ! "${{ steps.tools.outputs.node_path }}" "${{ github.workspace }}/tools/deploy-hooks.js" --check; then
            echo "FAILED: Hook drift detected"
            driftFound=1
            results="${results}• Hook deploy/registration drift detected\n"
          else
            echo "PASSED: No hook drift"
          fi

          echo "=== Checking installed agent definition drift ==="
          if ! "${{ steps.tools.outputs.node_path }}" "${{ github.workspace }}/tools/sync-agents.js" --check; then
            echo "FAILED: Agent drift detected"
            driftFound=1
            results="${results}• Agent definition drift detected\n"
          else
            echo "PASSED: No agent drift"
          fi

          echo "=== Checking for orphan hard cron routines ==="
          if ! "${{ steps.tools.outputs.node_path }}" "${{ github.workspace }}/tools/routines.js" verify; then
            echo "FAILED: Routine verification failed"
            driftFound=1
            results="${results}• Cron routine verification failed (orphan routines or cron mismatch)\n"
          else
            echo "PASSED: All routines verified"
          fi

          echo "drift_found=$driftFound" >> "$GITHUB_OUTPUT"
          echo "drift_results=$(printf '%b' "$results")" >> "$GITHUB_OUTPUT"
          exit "$driftFound"
        continue-on-error: true

      - name: Raise alert on drift detected
        if: steps.drift.outputs.drift_found == '1'
        shell: bash
        run: |
          "${{ steps.tools.outputs.node_path }}" "${{ github.workspace }}/tools/human-needed.js" raise enforcement-drift \
            --title "CI/CD enforcement drift detected" \
            --why "Daily drift check on $(date -u +%Y-%m-%dT%H:%M:%SZ) found mismatches between repo and deployed state. See [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --action "Run the three --check tools locally to diagnose:
          \`\`\`bash
          node tools/deploy-hooks.js --check
          node tools/sync-agents.js --check
          node tools/routines.js verify
          \`\`\`

          Then fix the drift and push. Common causes:
          • Hooks edited in ~/.claude/hooks/ but not committed to repo or not deployed
          • Agent defs edited in .agents/agents/ but sync-agents.js not run
          • Cron routine added to config/routines.yml but corresponding job not added to workflow, or vice versa
          • Hard cron routine marked enforce:hard but missing from workflow

          Re-run this check after fixing to verify and close the alert." \
            || echo "::warning::could not raise human-needed alert"
          exit 1

      - name: Resolve alert on clean drift check
        if: steps.drift.outputs.drift_found == '0'
        shell: bash
        run: |
          "${{ steps.tools.outputs.node_path }}" "${{ github.workspace }}/tools/human-needed.js" resolve enforcement-drift \
            --comment "Daily enforcement drift check passed at $(date -u +%Y-%m-%dT%H:%M:%SZ). All hooks, agents, and cron routines verified in sync." \
            || echo "::warning::could not resolve human-needed alert"

  # Life OS daily triage — STAGE 2 of the daily cadence.
  #
  # Stage 1 (06:00) is Grok Tasks running skills/daily-briefing/portable-prompt.md. It owns email
  # and archives a brief (with a machine-readable `handoff:` yaml block) to Google Drive under
  # `Life OS/briefings/`. Stage 2 does NOT re-verify that triage — it reads the handoff, covers the
  # messaging bridges Grok cannot reach (Beeper/Discord), and executes the AI-Actionable items.
  # If the brief is missing or stale the skill falls back to sweeping mail itself, so a missed
  # stage 1 degrades rather than breaking.
  #
  # Local-machine state by nature: needs the interactively-authenticated Notion/Gmail/Zoho/
  # Calendar/Drive MCP connectors in this host's ~/.claude, plus Beeper Desktop on localhost:23373,
  # so like every other job here it cannot run on a hosted runner.
  #
  # Weekly (Sunday) and monthly (last day) roll-ups are STEP 5 *inside* stage 1's prompt, so no
  # separate weekly/monthly crons belong here.
  #
  # Jarvis (opus, high effort) rather than Threepio: this run spawns per-item subagents, which is
  # orchestration, not writing. Concurrency and item caps live in the skill, not here.
  daily-triage:
    # The dispatch arm honours the `job` input now that there is a second dispatchable job. It
    # still defaults to daily-triage, so a bare `gh workflow run scheduled-tasks.yml` behaves
    # exactly as it always did.
    if: (github.event_name == 'schedule' && (github.event.schedule == '0 13 * * *' || github.event.schedule == '0 5 * * *')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'daily-triage')
    runs-on: [self-hosted, Linux]
    # Generous: 10 items x up to 30min each, batched 4 at a time, plus the gather pass.
    timeout-minutes: 180
    # tools/human-needed.js opens/closes the `human-needed` tracking issue from the preflight and
    # cleanup steps below.
    # contents+pull-requests are declared for documentation/defense-in-depth, but (#gh-token-shadow)
    # they do NOT drive the actual writes below — see the GH_TOKEN note in `env` for why.
    permissions:
      issues: write
      contents: write
      pull-requests: write
    # Job-level so every step sees it (step-level env does not carry across steps).
    # LIFE_REPO: where MC's GET /briefing reads from; keep in step with tools/mission-control/README.md.
    # ALERT_KEY: one key for "the daily triage is not working", shared with
    # daily-triage-watchdog.yml on purpose — two keys would mean two issues for one outage.
    #
    # #gh-token-shadow: deliberately NOT setting GH_TOKEN here. `gh` treats a GH_TOKEN env var as
    # an absolute override — it wins even over a fully-authenticated `hosts.yml` entry, and
    # `gh auth switch` cannot undo that at runtime ("The value of the GH_TOKEN environment
    # variable is being used for authentication"). Setting it to `secrets.GITHUB_TOKEN` here
    # measurably left every `gh` write in this job authenticated as `github-actions[bot]` with
    # push:false/pull:false/triage:false/maintain:false/admin:false on this repo (#243's actual
    # root cause — its title says "runner token cannot push" but `git push` was never the
    # problem, since this job has no `actions/checkout` step to wire the bot token into git's
    # credential helper; only `gh` reads GH_TOKEN, and only `gh` was broken). Leaving GH_TOKEN
    # unset lets `gh` fall through to the self-hosted runner's own `hosts.yml` credential (a
    # `repo`-scoped PAT), the same credential `git push` was already using — one fully-capable
    # identity for both, instead of a bot token that this repo's Actions settings leave with no
    # write access at all.
    #
    # Interaction with the #164/#228 "GITHUB_TOKEN-opened PRs don't fire pull_request" rule this
    # job used to lean on: that recursion guard is specific to the literal built-in GITHUB_TOKEN.
    # A PR opened with the PAT below is an ordinary authored PR, so `pull_request: opened` DOES
    # fire for it now (sam-audit.yml, friday-audit.yml, pr-automation.yml, ...). That is safe, not
    # a bypass: the skill still opens these `--draft`, and sam-audit.yml's job already skips
    # `pr.draft` PRs (see its `opened (non-draft only, see job if: below)` comment) — the audit
    # still only runs on the human's draft -> ready_for_review flip, same as before.
    env:
      LIFE_REPO: ${{ vars.LIFE_REPO || '' }}
      GH_REPO: ${{ github.repository }}
      ALERT_KEY: daily-triage-down
      # Chat sources, in preference order — see chatSources() in tools/life-os-doctor.js.
      # BEEPER_API_URL points at whichever machine runs Beeper Desktop with Remote Access on; it
      # is a laptop, so it may be asleep at run time. MATRIX_HOMESERVER is the
      # same account's homeserver on Beeper's own infrastructure, which is not.
      BEEPER_API_URL: ${{ vars.BEEPER_API_URL || 'http://localhost:23373' }}
      MATRIX_HOMESERVER: ${{ vars.MATRIX_HOMESERVER || '' }}
      # A SECRET, never a `vars.` entry: the step's env block is echoed into the run log, and
      # this repo is public. Secrets are masked as ***; variables are printed verbatim. It is a
      # bearer token for the whole chat history plus send capability.
      # Enables STEP 5b to place each draft in the Beeper composer (PATCH /v1/chats/{id}).
      BEEPER_ACCESS_TOKEN: ${{ secrets.BEEPER_ACCESS_TOKEN }}
      # Now set to 1: the `beeper` MCP server is authenticated and BEEPER_ACCESS_TOKEN exists, so
      # stage 2 can genuinely read chat (verified: 30 unread across six networks) and place drafts.
      # With coverage real, a chat outage should report as a gap rather than an accepted note.
      LIFE_OS_EXPECT_BEEPER: ${{ vars.LIFE_OS_EXPECT_BEEPER || '' }}
    steps:
      # No checkout: daily-triage is one of the private life-OS skills gitignored by #187, so it
      # exists only in this host's working copy — a fresh checkout would NOT contain it.
      #
      # REPO is resolved rather than hardcoded to $HOME/dev/AgentSystem: that symlink is an
      # invariant this repo asserts in several places but nothing creates or verifies, and when it
      # was absent the job died here every morning for days with no alert anywhere. Fall back to
      # the real checkout so a missing symlink degrades to a warning instead of an outage.
      - name: Resolve the working copy
        id: repo
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$HOME/dev/AgentSystem" "$HOME/AgentSystem"; do
            if [ -d "$candidate/tools" ]; then
              echo "repo=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using $candidate"
              [ "$candidate" = "$HOME/dev/AgentSystem" ] || \
                echo "::warning::$HOME/dev/AgentSystem is missing; fell back to $candidate. Recreate it — config/routines.yml and the installed hooks all invoke tools through that path."
              exit 0
            fi
          done
          echo "::error::No AgentSystem working copy found at $HOME/dev/AgentSystem or $HOME/AgentSystem."
          exit 1

      # Preflight before the model call, not inside it: every precondition is host state only a
      # human can fix (ship a gitignored file, authenticate a connector), so a blocked run should
      # cost nothing and say exactly what is wrong.
      #
      # The checks live in tools/life-os-doctor.js rather than in this YAML because they are worth
      # unit-testing and worth running by hand — `node tools/life-os-doctor.js` is the one command
      # that answers "can tomorrow's run work". It exits non-zero on blocking gaps only; missing
      # connectors degrade coverage and raise their own alert without failing the run.
      - name: Preflight — daily-triage doctor
        id: preflight
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
        run: |
          set -uo pipefail
          mkdir -p "${LIFE_REPO:-$HOME/life}/briefings" "${LIFE_REPO:-$HOME/life}/closeouts"
          # Warn, not fail: the fallback works and has been carrying every run, so hard-failing here
          # would turn a silent-but-correct default into a real outage. It is still worth saying out
          # loud, because nothing verifies that this path is the one MC's GET /briefing reads.
          if [ -z "${LIFE_REPO:-}" ]; then
            echo "::warning::LIFE_REPO is unset, so the closeout path falls back to $HOME/life. Set the LIFE_REPO repo variable to whatever tools/mission-control/README.md documents, so the two cannot drift apart unnoticed."
          fi
          if ! node "$REPO/tools/life-os-doctor.js" --alert; then
            echo "::error::daily-triage preflight found blocking gaps — see the table above."
            action=$(cat <<EOF
          Run \`node tools/life-os-doctor.js\` on \`$(hostname)\` for the full table; each failing
          check prints its own fix. The usual cause is the private life-OS skills being absent:
          they are gitignored (#187), so they exist only on the machine where they were authored
          and git will never carry them here. From that machine:

          \`\`\`bash
          bash tools/deploy-private-skills.sh --host $(whoami)@$(hostname)
          bash tools/deploy-private-skills.sh --host $(whoami)@$(hostname) --check
          \`\`\`

          Then confirm end to end with \`gh workflow run scheduled-tasks.yml -f job=daily-triage\`.
          This issue closes itself on the next successful run.
          EOF
            )
            node "$REPO/tools/human-needed.js" raise "$ALERT_KEY" \
              --title "[Life OS]: the daily triage cannot run" \
              --why "Preflight on \`$(hostname)\` found blocking gaps. See [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the doctor's table." \
              --action "$action" \
              || echo "::warning::could not raise the human-needed alert"
            exit 1
          fi

      # Retried, because a 529 is documented as temporary and treating it as "the triage is down"
      # was wrong: eight of the twelve scheduled runs between 2026-07-31 and 2026-08-05 died that
      # way (#234). The second-order cost was worse than the missed runs — each failure raised
      # `daily-triage-down` and the next success auto-closed it, so the alert flapped and a genuine
      # outage looked exactly like a minute of upstream overload.
      #
      # Retry ONLY on signals that are actually transient. A permissions rejection, a missing skill
      # or a bad agent name is deterministic; retrying those burns the window and delays the alert.
      # The 13:00/05:00 schedule leaves roughly 16h, so 60s + 300s of backoff costs nothing.
      - name: Run Life OS daily triage (Jarvis)
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
        run: |
          # `set +e`, not `set -e`: Actions invokes this as `bash --noprofile --norc -e -o pipefail`,
          # and a step's own `set -uo pipefail` does NOT clear that inherited `-e` — only `set +e`
          # does. That is why every run below died at the `claude ... | tee` pipeline the moment the
          # model exited nonzero: the pipeline failed, errexit killed the step, and everything after
          # it — the `rc` capture, the transient-vs-deterministic check, the whole #234 retry loop,
          # `TRIAGE_LAST_ERROR` — has never once executed in production. The 2026-08-08 13:00 run is
          # the clean proof: the triage finished its work ("closeout appended, 1 outbound draft
          # queued") and the step still reported exit 1 with none of its own diagnostics printed.
          # `-u` stays; the step ends with an explicit `exit "$rc"`, which is what should decide it.
          #
          # There is a second, independent errexit death further down, for the same reason: the exit
          # status of an assignment is the status of its command substitution, so `last=$(grep …)`
          # finding nothing exits 1. A *successful* triage has no `API Error:` line to match, so a
          # clean run died three seconds after printing `DONE:`, skipped the GITHUB_ENV write, and
          # re-raised `daily-triage-down` — five days red while the triage was working.
          set +e -uo pipefail
          # The skill writes the closeout itself (step 6) rather than this job capturing stdout:
          # it needs the file on disk before it pushes the notification, and a --bg subagent fan-out
          # means stdout is no longer a faithful transcript of the run.
          #
          # `Jarvis`, not `jarvis`. Agent names are case-sensitive and come from the `name:`
          # frontmatter in .agents/agents/<n>.md, which is capitalised for every supervisor. This
          # job said `jarvis` from the day it was written and failed instantly with
          # "--agent 'jarvis' not found" the first time it ever got far enough to reach the model
          # call — the missing-skill error had masked it until then. The trap is even documented in
          # this repo's own shared-blocks.md ("`--agent` names are case-sensitive").
          # life-os-doctor.js now checks the name in preflight so this cannot recur silently.
          #
          # The skill is referenced BY NAME, not by path. A non-interactive session is sandboxed to
          # the runner workspace, so `$REPO/skills/daily-triage/SKILL.md` is unreadable from here —
          # the 2026-08-05 run reported exactly that and fell back to the Skill registry itself.
          # `~/.claude/skills/daily-triage` is where deploy-private-skills.sh installs it, and the
          # registry resolves it regardless of sandbox.
          #
          # --add-dir: the sandbox otherwise excludes both the LIFE_REPO (where step 6 MUST write
          # the closeout) and the real checkout (STEP 4 runs its GitHub sweep there).
          # --settings: a reviewed allow/deny list, NOT --dangerously-skip-permissions. See the
          # header of config/daily-triage-permissions.json for why, and note the deny list turns the
          # skill's "hard limits" prose into rules the harness actually enforces.
          log="${RUNNER_TEMP:-/tmp}/daily-triage.log"
          attempts=3
          rc=1
          attempt=1
          while [ "$attempt" -le "$attempts" ]; do
            echo "::group::daily-triage attempt $attempt of $attempts"
            claude --agent Jarvis \
              --add-dir "${LIFE_REPO:-$HOME/life}" \
              --add-dir "$REPO" \
              --settings "$REPO/config/daily-triage-permissions.json" \
              -p "Use the daily-triage skill and execute it now." 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" -eq 0 ] && break
            if ! grep -Eqi 'API Error: (429|500|502|503|504|529)|Overloaded|Connection error|ECONNRESET|connection reset' "$log"; then
              echo "::error::daily-triage failed with a non-transient error (exit $rc). Not retrying — see the log above."
              break
            fi
            # Increment only when we are actually going round again, so $attempt below is the
            # number of tries made rather than one past it.
            [ "$attempt" -ge "$attempts" ] && break
            if [ "$attempt" -eq 1 ]; then backoff=60; else backoff=300; fi
            echo "::warning::transient upstream error (exit $rc) on attempt $attempt — retrying in ${backoff}s"
            sleep "$backoff"
            attempt=$((attempt + 1))
          done

          # Hand the failure step something specific, so "overloaded all day" stops looking
          # identical to "the connector expired" in the human-needed issue.
          last=$(grep -Eio 'API Error: [0-9]{3}[^"]{0,80}|Connection error[^"]{0,80}|ECONNRESET' "$log" 2>/dev/null | tail -1 | tr -d '\r' | cut -c1-160)
          {
            echo "TRIAGE_ATTEMPTS=$attempt"
            echo "TRIAGE_LAST_ERROR=${last:-no upstream error line captured}"
          } >> "$GITHUB_ENV"

          # Reconcile the exit code against the deliverable. The closeout is the authoritative
          # signal that the day's work happened — Mission Control serves that file, and the skill
          # writes it before it does anything else that could taint the exit status (a denied tool,
          # a SessionEnd hook, a --bg subagent outliving its parent). So a nonzero exit with a
          # non-empty closeout on disk is degraded-but-successful: warn, stay green, keep the day's
          # coverage.
          #
          # Not a blanket "ignore the exit code". With no closeout, `rc` is left alone and the step
          # stays red, because a false-green is worse than a false-red here: the next step
          # re-checks the same file independently, and the alert step still fires. The two
          # conditions now agree instead of contradicting each other.
          closeout="${LIFE_REPO:-$HOME/life}/closeouts/$(date +%F).md"
          if [ "$rc" -ne 0 ] && [ -s "$closeout" ]; then
            echo "::warning::claude exited $rc, but $closeout is present and non-empty — treating this as a degraded-but-successful run. Something failed after the closeout was written; read the log above."
            rc=0
          fi
          exit "$rc"

      # Loud on failure by design. A silent no-op is the failure mode that hurts: you find out
      # at lunch. A red run alone was not enough — it emails the hub inbox, which stage 1 triages the
      # *next* morning, so the pipeline reported its own outage a day late and four consecutive
      # failures went unnoticed. The human-needed issue is the out-of-band channel.
      - name: Confirm the closeout is renderable by Mission Control
        shell: bash
        run: |
          set -uo pipefail
          dir="${LIFE_REPO:-$HOME/life}/closeouts"
          today=$(date +%F)
          if [ ! -s "$dir/$today.md" ]; then
            echo "::error::$dir/$today.md missing or empty — the triage produced no closeout."
            exit 1
          fi
          echo "MC will serve: $today.md"

      # Only on a fully green run: the closeout exists, so MC has something to serve and the
      # outage really is over. `if: success()` rather than `always()` for exactly that reason.
      - name: Clear the human-needed alert
        if: success()
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
        run: |
          node "$REPO/tools/human-needed.js" resolve "$ALERT_KEY" \
            --comment "Daily triage completed successfully at $(date -u +%Y-%m-%dT%H:%M:%SZ) and wrote today's closeout." \
            || echo "::warning::could not clear the human-needed alert"

      # Catches the failures the preflight cannot predict — the model run erroring, an MCP
      # connector unauthenticated, the closeout never written. Without this, a failure *after*
      # preflight produced only a red run.
      - name: Raise the human-needed alert (run failed)
        if: failure() && steps.preflight.outcome == 'success'
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
        run: |
          node "$REPO/tools/human-needed.js" raise "$ALERT_KEY" \
            --title "[Life OS]: the daily triage is failing" \
            --why "Preflight passed but the run failed on \`$(hostname)\` after ${TRIAGE_ATTEMPTS:-1} attempt(s). Last upstream error: \`${TRIAGE_LAST_ERROR:-none captured}\`. See [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Three attempts all failing on a 429/529 means upstream was overloaded for the whole window; anything else means the run itself is broken." \
            --action "Read the run log. The usual causes are an expired interactive MCP connector (Notion/Gmail/Calendar/Drive) in this host's \`~/.claude\`, Beeper Desktop not listening on localhost:23373, or the skill erroring before it wrote the closeout. Re-run with \`gh workflow run scheduled-tasks.yml -f job=daily-triage\` once fixed; this issue closes itself on the next successful run." \
            || echo "::warning::could not raise the human-needed alert"

  # memory-maintenance.js operates on the local ~/agent-memory brain — local machine state.
  weekly-brain-consolidation:
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Run full memory sleep cycle
        shell: bash
        run: |
          node "${{ github.workspace }}/tools/memory-maintenance.js" --reflect

  # memory-decay.js reads/writes ~/agent-memory/nexus/* brains directly — local machine state.
  weekly-memory-decay:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Memory decay
        shell: bash
        run: |
          node "${{ github.workspace }}/tools/memory-decay.js" --brain=agentsystem
          node "${{ github.workspace }}/tools/memory-decay.js" --brain=personal-brain

  # compute-trust-scores.js reads ~/agent-memory/nexus/run-log/* — local machine state.
  weekly-trust-scores:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Compute trust scores
        shell: bash
        run: node "${{ github.workspace }}/tools/compute-trust-scores.js"
      # #168: feed real routing-accuracy data into trust-scores.md weekly so the router
      # (memory-router.js) reads live numbers instead of a stale/empty stub.
      - name: Append routing accuracy to trust-scores.md
        shell: bash
        run: |
          report=$(node "${{ github.workspace }}/tools/routing-report.js")
          target="$HOME/agent-memory/nexus/trust-scores.md"
          {
            printf '\n## Routing Accuracy (auto-updated %s)\n' "$(date +%Y-%m-%d)"
            printf '%s\n' "$report"
          } >> "$target"

  # Operates on ~/.claude and ~/agent-memory directly (rotate-logs, claude-json-hygiene,
  # caveman-cache-fix, deploy-hooks --check) — none of these paths exist on a hosted runner.
  weekly-hygiene:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Rotate jsonl logs (session-log etc.)
        shell: bash
        run: node "${{ github.workspace }}/tools/rotate-logs.js" --threshold-mb=5 --keep=3
      # #168: session-log.jsonl archive-with-30-day-retention + auto-capture.log truncation.
      # Separate tool from rotate-logs.js above: different semantics (dated archive +
      # retention window vs. generation-suffix rotation; also handles non-.jsonl .log files).
      - name: Archive session-log.jsonl + truncate auto-capture.log
        shell: bash
        run: node "${{ github.workspace }}/tools/log-rotate.js" --jsonl-threshold-kb=500 --log-threshold-kb=100 --keep-days=30
      - name: Prune ~/.claude tmp orphans + backup churn
        shell: bash
        run: node "${{ github.workspace }}/tools/claude-json-hygiene.js" --keep=5 --tmp-age-hours=24
      - name: Dedupe caveman plugin cache
        shell: bash
        run: node "${{ github.workspace }}/tools/caveman-cache-fix.js"
      - name: Report hook drift (repo vs ~/.claude)
        shell: bash
        run: node "${{ github.workspace }}/tools/deploy-hooks.js" --check
        continue-on-error: true

  # Weekly agent fleet review. Self-hosted because every input is local machine state:
  # ~/agent-memory/nexus/routing-log.jsonl, session-log.jsonl, and this host's checkout.
  #
  # A real headless Jarvis run, not a fixed script, because the deliverable is a judgement no tool
  # emits: session-cost.js says the week cost $N and routing-report.js says branch X hit 60%, but
  # "which agent is being handed work it keeps bouncing, and what should change" is the review.
  # That costs roughly one unattended opus run a week, which is the deliberate trade for having the
  # routine enforced at all — see config/routines.yml.
  #
  # No checkout step: like daily-triage, this reads the host's real working copy (routing history,
  # the brain, git history that a fresh shallow checkout does not have). REPO is resolved rather
  # than hardcoded to $HOME/dev/AgentSystem for the same reason it is there — that symlink is an
  # invariant nothing creates or verifies.
  weekly-agent-review:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 6') || (github.event_name == 'workflow_dispatch' && inputs.job == 'weekly-agent-review')
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    # Documentation/defense-in-depth only: GH_TOKEN is deliberately unset here too, so `gh` falls
    # through to the runner's own hosts.yml credential. See the #gh-token-shadow note on
    # daily-triage for why setting it would silently break every `gh` write in the job.
    permissions:
      issues: write
      contents: read
      pull-requests: read
    env:
      GH_REPO: ${{ github.repository }}
      ALERT_KEY: weekly-agent-review-down
    steps:
      - name: Resolve the working copy
        id: repo
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$HOME/dev/AgentSystem" "$HOME/AgentSystem"; do
            if [ -d "$candidate/tools" ]; then
              echo "repo=$candidate" >> "$GITHUB_OUTPUT"
              echo "Using $candidate"
              [ "$candidate" = "$HOME/dev/AgentSystem" ] || \
                echo "::warning::$HOME/dev/AgentSystem is missing; fell back to $candidate."
              exit 0
            fi
          done
          echo "::error::No AgentSystem working copy found at $HOME/dev/AgentSystem or $HOME/AgentSystem."
          exit 1

      # The deterministic numbers run first and print into the log unconditionally, so a failed or
      # refused model call still leaves the week's costs and routing accuracy somewhere a human can
      # read them. Neither tool is allowed to fail the job: an empty session-log (a quiet week, a
      # rotated log) is not an outage, and losing the review over it would be the #234 mistake again.
      - name: Collect the week's raw numbers
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
        run: |
          set +e -uo pipefail
          echo "::group::session costs (last 7 days)"
          node "$REPO/tools/session-cost.js" --week || echo "::warning::session-cost.js exited nonzero"
          echo "::endgroup::"
          echo "::group::routing accuracy"
          node "$REPO/tools/routing-report.js" || echo "::warning::routing-report.js exited nonzero"
          echo "::endgroup::"

      # Retried on transient upstream errors only, for the reasons written out at the daily-triage
      # step above (#234). Weekly, a lost window costs a week rather than a day, so the retry earns
      # its keep even though the run is cheap.
      - name: Weekly agent review (Jarvis)
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
        run: |
          # `set +e` deliberately: Actions runs steps under an inherited `-e` that a step's own
          # `set -uo pipefail` does not clear, which silently killed every retry loop in the
          # daily-triage step. Same shape here, same fix; `exit "$rc"` decides the step.
          set +e -uo pipefail
          log="${RUNNER_TEMP:-/tmp}/weekly-agent-review.log"
          # `Jarvis`, capitalised — agent names are case-sensitive and come from the `name:`
          # frontmatter in .agents/agents/<name>.md.
          prompt=$(cat <<'EOF'
          Weekly agent fleet review for the AgentSystem fleet. Read-only except for the decision
          record at the end; Write and Edit are denied by the harness, so do not try to change files.

          Gather:
          1. Routing — node tools/routing-report.js, and read ~/agent-memory/nexus/routing-log.jsonl
             for the last 7 days. Which agents were misrouted to, and what do the misroutes have in
             common?
          2. Cost — node tools/session-cost.js --week. Flag anything anomalous against the weeks
             before it (the log holds the history), not against an absolute number.
          3. Blockers — gh issue list --label human-needed --state open, and gh pr list --state open.
             Call out anything open more than 7 days, and any PR blocked on Sam's audit.
          4. Goals — read the open issues and the last week of git log on main. Did the week's merged
             work move the stated goals, or was it maintenance?

          Then write ONE decision record with the verdict and the single most valuable change to make
          next week:

          node tools/decision-log.js --write --agent=Jarvis --project=agentsystem \
            --title="Weekly agent review <YYYY-MM-DD>" \
            --decision="<the one change to make next week>" \
            --rationale="<routing, cost, blocker and goal findings that support it>"

          Keep the rationale specific — numbers and issue/PR references, not adjectives. Finish by
          printing DONE: followed by a one-line summary.
          EOF
          )
          attempts=3
          rc=1
          attempt=1
          while [ "$attempt" -le "$attempts" ]; do
            echo "::group::weekly-agent-review attempt $attempt of $attempts"
            claude --agent Jarvis \
              --add-dir "$REPO" \
              --add-dir "$HOME/agent-memory" \
              --settings "$REPO/config/weekly-agent-review-permissions.json" \
              -p "$prompt" 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "$rc" -eq 0 ] && break
            if ! grep -Eqi 'API Error: (429|500|502|503|504|529)|Overloaded|Connection error|ECONNRESET|connection reset' "$log"; then
              echo "::error::weekly-agent-review failed with a non-transient error (exit $rc). Not retrying — see the log above."
              break
            fi
            [ "$attempt" -ge "$attempts" ] && break
            if [ "$attempt" -eq 1 ]; then backoff=60; else backoff=300; fi
            echo "::warning::transient upstream error (exit $rc) on attempt $attempt — retrying in ${backoff}s"
            sleep "$backoff"
            attempt=$((attempt + 1))
          done

          # Reconcile the exit code against the deliverable, same reasoning as the closeout check in
          # daily-triage: the decision record is what this job exists to produce, so a nonzero exit
          # with the record on disk is degraded-but-successful. With no record, `rc` stands.
          if ls "$HOME/agent-memory/nexus/decisions/$(date +%F)"-*.md >/dev/null 2>&1; then
            [ "$rc" -ne 0 ] && echo "::warning::claude exited $rc but today's decision record exists — treating as degraded-but-successful."
            rc=0
          elif [ "$rc" -eq 0 ]; then
            echo "::error::claude exited 0 but wrote no decision record for $(date +%F) — the review did not produce its one deliverable."
            rc=1
          fi
          exit "$rc"

      # Out-of-band, for the same reason daily-triage has one: a red weekly run emails an inbox that
      # is triaged on a weekday, so a quiet failure can eat several weeks before anyone notices.
      - name: Clear the human-needed alert
        if: success()
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
        run: |
          node "$REPO/tools/human-needed.js" resolve "$ALERT_KEY" \
            --comment "Weekly agent review completed successfully at $(date -u +%Y-%m-%dT%H:%M:%SZ)." \
            || echo "::warning::could not clear the human-needed alert"

      - name: Raise the human-needed alert (run failed)
        if: failure()
        shell: bash
        env:
          REPO: ${{ steps.repo.outputs.repo }}
        run: |
          node "$REPO/tools/human-needed.js" raise "$ALERT_KEY" \
            --title "[AgentSystem]: the weekly agent review is failing" \
            --why "The Saturday review failed on \`$(hostname)\`. See [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --action "Read the run log. Usual causes: the \`claude\` CLI missing or unauthenticated on this host, a denied tool the review needed (widen config/weekly-agent-review-permissions.json in a PR, not on the box), or ~/agent-memory being unwritable. Re-run with \`gh workflow run scheduled-tasks.yml -f job=weekly-agent-review\`; this issue closes itself on the next successful run." \
            || echo "::warning::could not raise the human-needed alert"
