# #154: every job below reads or writes local-machine state that only exists on the
# self-hosted runner's host (~/agent-memory/nexus/*, ~/.claude) — none of it is portable to a
# GitHub-hosted runner, so none of these jobs can be migrated to ubuntu-latest. When the
# self-hosted runner is offline these jobs simply never start (no failure signal on their own);
# `.github/workflows/runner-health-check.yml` runs on ubuntu-latest specifically to detect that
# condition from outside and open/update a `runner:down` tracking issue, which is the loud-failure
# signal for this whole file.
#
# #164: pr-auto-review (cavecrew reviewer) job removed. friday-audit.yml is now the single
# engineering reviewer on every PR; sam-audit.yml remains the security gate.
#
# Runner is the Linux self-hosted runner co-located with Mission Control
# (tools/mission-control/install-runner.sh). Steps run under bash; the default
# self-hosted,Linux,X64 labels satisfy `runs-on: [self-hosted, Linux]`.
name: Scheduled Tasks

on:
  schedule:
    # weekly-brain-consolidation: Monday 8am UTC
    - cron: '0 8 * * 1'
    # weekly-memory-decay + weekly-trust-scores + weekly-hygiene: Sunday midnight UTC
    - cron: '0 0 * * 0'
    # daily-briefing (Life OS triage): every day 6am UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually (currently only daily-briefing)'
        required: false
        default: daily-briefing

jobs:
  # Life OS daily triage. Local-machine state by nature: needs the interactively-authenticated
  # Notion/Gmail/Zoho/Calendar/Drive MCP connectors in this host's ~/.claude, so like every other
  # job here it cannot run on a hosted runner. Weekly (Sunday) and monthly (last day) roll-ups are
  # STEP 5 *inside* the prompt, so this one daily cron covers all three cadences — do not add
  # separate weekly/monthly crons for them.
  #
  # --model claude-sonnet-5 deliberately overrides Threepio's haiku default: sweeping every mail
  # folder plus two Notion databases routinely exceeds haiku's 200K window.
  daily-briefing:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux]
    # Job-level so both steps below see it (step-level env does not carry across steps).
    # Where MC's GET /briefing reads from; keep in step with tools/mission-control/README.md.
    env:
      LIFE_REPO: ${{ vars.LIFE_REPO || '' }}
    steps:
      # No checkout: the daily-briefing skill is one of the private life-OS skills gitignored by
      # #187, so it exists only in this host's working copy — a fresh checkout would NOT contain
      # it. $HOME/dev/AgentSystem is the stable symlink to that copy.
      - name: Run Life OS daily briefing (Threepio) and archive the digest for Mission Control
        shell: bash
        run: |
          set -euo pipefail
          skill="$HOME/dev/AgentSystem/skills/daily-briefing/SKILL.md"
          if [ ! -f "$skill" ]; then
            echo "::error::$skill missing — the private life-OS skill is not in this host's working copy."
            exit 1
          fi
          dir="${LIFE_REPO:-$HOME/life}/briefings"
          mkdir -p "$dir"
          # The skill's STEP 4 prints the digest, so capturing stdout is all the archiving MC needs
          # — the private skill itself stays unaware of Mission Control. YYYY-MM-DD.md is the exact
          # name GET /briefing sorts and serves; a same-day re-run overwrites, which is intended.
          claude --agent threepio --model claude-sonnet-5 \
            -p "Read $skill and execute it now." | tee "$dir/$(date +%F).md"
      - name: Confirm the digest is renderable by Mission Control
        shell: bash
        run: |
          dir="${LIFE_REPO:-$HOME/life}/briefings"
          latest=$(ls "$dir" 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' | sort | tail -1 || true)
          if [ -z "$latest" ]; then
            echo "::warning::No YYYY-MM-DD.md in $dir — MC /briefing will 404."
          elif [ ! -s "$dir/$latest" ]; then
            echo "::warning::$latest is empty — the run produced no digest (connectors offline?)."
          else
            echo "MC will serve: $latest"
          fi

  # memory-maintenance.js operates on the local ~/agent-memory brain — local machine state.
  weekly-brain-consolidation:
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Run full memory sleep cycle
        shell: bash
        run: |
          node "${{ github.workspace }}/tools/memory-maintenance.js" --reflect

  # memory-decay.js reads/writes ~/agent-memory/nexus/* brains directly — local machine state.
  weekly-memory-decay:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Memory decay
        shell: bash
        run: |
          node "${{ github.workspace }}/tools/memory-decay.js" --brain=agentsystem
          node "${{ github.workspace }}/tools/memory-decay.js" --brain=personal-brain

  # compute-trust-scores.js reads ~/agent-memory/nexus/run-log/* — local machine state.
  weekly-trust-scores:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Compute trust scores
        shell: bash
        run: node "${{ github.workspace }}/tools/compute-trust-scores.js"
      # #168: feed real routing-accuracy data into trust-scores.md weekly so the router
      # (memory-router.js) reads live numbers instead of a stale/empty stub.
      - name: Append routing accuracy to trust-scores.md
        shell: bash
        run: |
          report=$(node "${{ github.workspace }}/tools/routing-report.js")
          target="$HOME/agent-memory/nexus/trust-scores.md"
          {
            printf '\n## Routing Accuracy (auto-updated %s)\n' "$(date +%Y-%m-%d)"
            printf '%s\n' "$report"
          } >> "$target"

  # Operates on ~/.claude and ~/agent-memory directly (rotate-logs, claude-json-hygiene,
  # caveman-cache-fix, deploy-hooks --check) — none of these paths exist on a hosted runner.
  weekly-hygiene:
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Rotate jsonl logs (session-log etc.)
        shell: bash
        run: node "${{ github.workspace }}/tools/rotate-logs.js" --threshold-mb=5 --keep=3
      # #168: session-log.jsonl archive-with-30-day-retention + auto-capture.log truncation.
      # Separate tool from rotate-logs.js above: different semantics (dated archive +
      # retention window vs. generation-suffix rotation; also handles non-.jsonl .log files).
      - name: Archive session-log.jsonl + truncate auto-capture.log
        shell: bash
        run: node "${{ github.workspace }}/tools/log-rotate.js" --jsonl-threshold-kb=500 --log-threshold-kb=100 --keep-days=30
      - name: Prune ~/.claude tmp orphans + backup churn
        shell: bash
        run: node "${{ github.workspace }}/tools/claude-json-hygiene.js" --keep=5 --tmp-age-hours=24
      - name: Dedupe caveman plugin cache
        shell: bash
        run: node "${{ github.workspace }}/tools/caveman-cache-fix.js"
      - name: Report hook drift (repo vs ~/.claude)
        shell: bash
        run: node "${{ github.workspace }}/tools/deploy-hooks.js" --check
        continue-on-error: true
