name: Self-Hosted Runner Health Check

# agent-dispatch.yml and sam-audit.yml require `runs-on: self-hosted`.
# If the self-hosted runner is offline, jobs targeting it never start — no failure notification,
# no PR comment, nothing queues or retries. This is a documented single point of failure (#115).
# This workflow runs on GitHub-hosted infra (ubuntu-latest) specifically so it can detect and
# report that condition even when the self-hosted runner itself is unreachable.

on:
  schedule:
    - cron: '0 6 * * *'  # daily 6am UTC (was hourly - ~720 ubuntu-latest min/mo)
  workflow_dispatch: {}

# NOTE: `administration` is NOT a valid key in a workflow `permissions:` block (valid set:
# actions, checks, contents, deployments, id-token, issues, discussions, packages, pages,
# pull-requests, repository-projects, security-events, statuses, attestations, models) — an
# earlier revision of this file used it and failed to parse (0s "workflow file issue" runs).
# Separately, `GET /repos/{owner}/{repo}/actions/runners` needs repo Administration:read, which
# the ephemeral GITHUB_TOKEN can NEVER be granted regardless of the `permissions:` block — it
# requires a real PAT. See the "Check self-hosted runner status" step below for how this is
# handled (optional PAT with graceful indirect-detection fallback).
permissions:
  issues: write

jobs:
  check-runner:
    runs-on: ubuntu-latest
    env:
      # This job does not check out the repo, so `gh issue ...` has no git remote to
      # infer the repo from and every call errors. Without this the auto-close step
      # failed on every run — the health check reported itself red daily for a reason
      # unrelated to runner health, which trains everyone to ignore it.
      GH_REPO: ${{ github.repository }}
      # Jobs target `runs-on: [self-hosted, Linux]`. A runner that is online but does
      # not carry every one of these labels can never pick those jobs up, so it is
      # not "healthy" for our purposes.
      REQUIRED_LABELS: 'self-hosted,Linux'
    steps:
      # Primary method: GET /actions/runners, which needs a PAT with Administration:read (the
      # workflow's own GITHUB_TOKEN can't be granted this permission at all). If the optional
      # `RUNNER_ADMIN_TOKEN` secret (a fine-grained PAT scoped to this repo with
      # "Administration: Read-only") isn't configured, or the API call fails for any reason
      # (bad/expired token, insufficient scope, etc.), degrade gracefully to an indirect method
      # instead of failing the whole job: look for jobs stuck `queued` for a while on the
      # self-hosted-targeting workflows (agent-dispatch.yml, sam-audit.yml)
      # — a queued job with no runner to pick it up is itself evidence
      # the runner is down.
      - name: Check self-hosted runner status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
        run: |
          set +e
          method=""
          # up | down | unknown. Indirect detection can only ever prove "down"; it must
          # not be read as proof of health (see below).
          state=""
          detail=""

          if [ -n "$RUNNER_ADMIN_TOKEN" ]; then
            runners_json=$(GH_TOKEN="$RUNNER_ADMIN_TOKEN" gh api "repos/${{ github.repository }}/actions/runners" 2>/tmp/runners_err)
            if [ $? -eq 0 ]; then
              method="direct"
              # A runner counts only if it is online AND carries every required label.
              # The previous version counted any online runner, so a Windows-labelled
              # runner read as healthy while every [self-hosted, Linux] job queued forever.
              usable=$(echo "$runners_json" | jq --arg req "$REQUIRED_LABELS" '
                ($req | split(",")) as $need
                | [ .runners[]
                    | select(.status == "online")
                    | ([.labels[].name]) as $have
                    | select( [ $need[] | IN($have[]) ] | all )
                  ] | length')
              detail=$(echo "$runners_json" | jq -r '[.runners[] | "\(.name)[\(.status),\([.labels[].name]|join("/"))]"] | join(" ")')
              [ "${usable:-0}" -lt 1 ] && state=down || state=up
            else
              echo "RUNNER_ADMIN_TOKEN present but /actions/runners call failed, falling back to indirect detection:" >&2
              cat /tmp/runners_err >&2
            fi
          fi

          if [ -z "$state" ]; then
            # Indirect detection: a job still `queued` after 10 minutes means no runner
            # picked it up. The absence of stuck jobs proves nothing — it usually just
            # means nobody triggered those workflows today. Reporting that as healthy is
            # what let a permanently offline runner go unnoticed, so "no evidence" is
            # now `unknown`, which neither opens nor closes the tracking issue.
            method="indirect"
            stuck=0
            for wf in agent-dispatch.yml sam-audit.yml scheduled-tasks.yml; do
              runs_json=$(gh api "repos/${{ github.repository }}/actions/workflows/$wf/runs?status=queued&per_page=10" 2>/dev/null)
              [ -z "$runs_json" ] && continue
              count=$(echo "$runs_json" | jq --arg cutoff "$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)" \
                '[.workflow_runs[]? | select(.created_at < $cutoff)] | length' 2>/dev/null || echo 0)
              stuck=$((stuck + count))
            done
            if [ "$stuck" -gt 0 ]; then
              state=down
              detail="$stuck job(s) queued >10min with no runner"
            else
              state=unknown
              detail="no RUNNER_ADMIN_TOKEN secret and no stuck jobs — health cannot be confirmed"
            fi
          fi

          echo "method=$method"   >> "$GITHUB_OUTPUT"
          echo "state=$state"     >> "$GITHUB_OUTPUT"
          echo "down=$([ "$state" = down ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "detail=$detail"   >> "$GITHUB_OUTPUT"
          echo "Runner health check: method=$method state=$state — $detail"
          if [ "$state" = unknown ]; then
            echo "::warning::Runner health could not be confirmed ($detail). Set the RUNNER_ADMIN_TOKEN secret (fine-grained PAT, Administration: Read-only) for direct detection."
          fi

      - name: Ensure tracking label exists
        if: steps.check.outputs.down == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "runner:down" --color "B60205" \
            --description "Self-hosted runner offline; agent-dispatch/sam-audit blocked" \
            2>/dev/null || true

      - name: Find existing tracking issue
        id: find
        if: steps.check.outputs.down == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_number=$(gh issue list --state open --label "runner:down" --json number --jq '.[0].number // empty')
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue (runner down)
        if: steps.check.outputs.down == 'true' && steps.find.outputs.issue_number == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[Infra]: self-hosted runner offline — agent-dispatch/sam-audit blocked" \
            --label "runner:down" \
            --body "No usable self-hosted runner detected as of $(date -u +%Y-%m-%dT%H:%M:%SZ) (detection method: \`${{ steps.check.outputs.method }}\`, required labels: \`${{ env.REQUIRED_LABELS }}\`). Observed: \`${{ steps.check.outputs.detail }}\`. \`/agent\`, \`/merge\`, \`/close\` dispatch, the Sam CI audit gate, and the nightly memory/maintenance tasks will silently no-op until a runner carrying all required labels is online. This issue auto-closes on the next daily check once that is true."

      - name: Comment ping on existing tracking issue
        if: steps.check.outputs.down == 'true' && steps.find.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ steps.find.outputs.issue_number }}" \
            --body "Still down as of $(date -u +%Y-%m-%dT%H:%M:%SZ) — ${{ steps.check.outputs.detail }}."

      # Only a direct, label-aware check can prove the runner is usable. `unknown`
      # deliberately does not close the issue.
      - name: Auto-close tracking issue (runner back online)
        if: steps.check.outputs.state == 'up'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_number=$(gh issue list --state open --label "runner:down" --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --comment "Self-hosted runner back online as of $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          fi
