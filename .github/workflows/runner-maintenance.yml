# runner-maintenance.yml — hands-on maintenance for the self-hosted runner's host state, from a
# dispatch instead of a shell.
#
# ── Why this workflow exists ─────────────────────────────────────────────────────────────────
#
# `ssh 100.82.195.75` is refused (port 22, Connection refused), so there is no interactive path to
# the box that holds ~/agent-memory, ~/.claude and the merge gate. The runner does execute every
# job dispatched to it, which is a remote-execution channel this repo already trusts and is the
# only one available. This file is that channel, deliberately narrowed.
#
# ── Why the input is `type: choice` and never a string ───────────────────────────────────────
#
# Every step below runs privileged commands on the host that also runs sam-audit.yml, the hard
# gate on merges to main. A free-form string input would be arbitrary remote code execution on the
# machine that decides what gets merged: anyone able to dispatch a workflow could run anything as
# the runner user. A closed choice list means the only thing a dispatcher chooses is WHICH of
# three reviewed scripts runs, and the scripts themselves are reviewed in this file.
#
# ── Why there is no `schedule:` ──────────────────────────────────────────────────────────────
#
# workflow_dispatch ONLY. config/routines.yml requires every `mechanism: cron` routine to have a
# matching job in scheduled-tasks.yml with the same cron expression, and `node tools/routines.js
# verify` exits 1 on a mismatch. A dispatch-only maintenance workflow is not a routine and must
# not quietly become one. Repair is also not a thing that should happen unattended — a human
# reads `status` first and decides.
#
# ── Why there is no `paths:` filter ──────────────────────────────────────────────────────────
#
# Nothing here is or could become a required status check, and #316 is the reason the question is
# even worth answering: an ABSENT check is not a failing one — GitHub leaves it permanently
# pending, the PR becomes unmergeable, and `enforce_admins: true` leaves no override.

name: Runner Maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do on the runner host'
        required: true
        default: status
        type: choice
        options:
          # Read-only. Changes nothing. Always run this first.
          - status
          # Reconcile ~/agent-memory, resolve committed conflict markers, rebuild the graphs.
          - repair-brain
          # One-time bootstrap of ~/agent-memory/nexus/run-log/ so weekly-trust-scores can run.
          - bootstrap-run-log
          # Re-deploy hooks + agent defs and install the memory sync timer, then prove the drift
          # is gone. Reads ~/agent-memory but never writes it and never pushes anything.
          - repair-install

# Two dispatches touching ~/agent-memory at once would produce exactly the half-merged tree this
# workflow exists to repair.
concurrency:
  group: runner-maintenance
  cancel-in-progress: false

jobs:
  # ── status ─────────────────────────────────────────────────────────────────────────────────
  # Read-only by construction. Every command here either reads or reports; none writes to the
  # brain, and none of them may fail the job — an unknown state must still be reported, because
  # "the status probe went red" tells a human nothing about the brain.
  status:
    if: inputs.mode == 'status'
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Report the runner's brain state
        shell: bash
        run: |
          set -uo pipefail
          BRAIN="$HOME/agent-memory"
          WS="$GITHUB_WORKSPACE"

          out() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          out "## Runner brain status"
          out ""
          out '```'
          out "host          $(hostname)"
          out "date (UTC)    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          out "brain root    $BRAIN"

          if [ ! -e "$BRAIN" ]; then
            out "STATE         MISSING — $BRAIN does not exist on this host"
            out '```'
            exit 0
          fi

          if ! git -C "$BRAIN" rev-parse --git-dir >/dev/null 2>&1; then
            out "STATE         NOT A GIT CHECKOUT — brain-sync.js cannot run here"
            out '```'
            exit 0
          fi

          GITDIR="$(git -C "$BRAIN" rev-parse --absolute-git-dir 2>/dev/null)"
          BRANCH="$(git -C "$BRAIN" rev-parse --abbrev-ref HEAD 2>/dev/null)"
          out "branch        $BRANCH"
          out "HEAD          $(git -C "$BRAIN" log -1 --format='%h %ad %s' --date=iso 2>/dev/null)"

          IN_MERGE=no; [ -f "$GITDIR/MERGE_HEAD" ] && IN_MERGE=YES
          IN_REBASE=no
          { [ -d "$GITDIR/rebase-merge" ] || [ -d "$GITDIR/rebase-apply" ]; } && IN_REBASE=YES
          out "mid-merge     $IN_MERGE"
          out "mid-rebase    $IN_REBASE"

          # Fetch is read-only with respect to the working tree — it only updates remote refs.
          if git -C "$BRAIN" fetch --quiet origin 2>/dev/null; then
            COUNTS="$(git -C "$BRAIN" rev-list --left-right --count "origin/$BRANCH...HEAD" 2>/dev/null || echo '? ?')"
            out "behind/ahead  $COUNTS   (left = on origin only, right = LOCAL ONLY, exists nowhere else)"
          else
            out "behind/ahead  fetch failed — cannot compare with origin"
          fi

          UNMERGED="$(git -C "$BRAIN" diff --name-only --diff-filter=U 2>/dev/null | wc -l)"
          DIRTY="$(git -C "$BRAIN" status --porcelain 2>/dev/null | wc -l)"
          out "dirty paths   $DIRTY"
          out "unmerged      $UNMERGED"
          out '```'

          out ""
          out "### Working tree (first 40 entries of --porcelain)"
          out '```'
          git -C "$BRAIN" status --porcelain 2>/dev/null | head -40 | tee -a "$GITHUB_STEP_SUMMARY" || true
          out '```'

          out ""
          out "### Conflict markers (read-only --check; exit 1 here just means markers exist)"
          out '```'
          node "$WS/tools/resolve-brain-markers.js" --root="$BRAIN" --check 2>&1 | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
          out '```'

          out ""
          out "### Brains under nexus/ and whether their graph.json parses"
          out '```'
          for dir in "$BRAIN"/nexus/*/; do
            [ -d "$dir" ] || continue
            slug="$(basename "${dir%/}")"
            g="${dir%/}/graph.json"
            if [ ! -f "$g" ]; then
              out "$slug — no graph.json"
            elif node --input-type=module -e 'import {readFileSync} from "node:fs"; const g=JSON.parse(readFileSync(process.argv[1],"utf8")); console.log(`${(g.nodes||[]).length} nodes, ${(g.edges||[]).length} edges`);' "$g" >/tmp/gs 2>/dev/null; then
              out "$slug — OK — $(cat /tmp/gs)"
            else
              out "$slug — UNPARSEABLE graph.json (this is what breaks memory-decay)"
            fi
          done
          out '```'

          out ""
          out "### run-log (weekly-trust-scores input)"
          out '```'
          if [ -d "$BRAIN/nexus/run-log" ]; then
            out "run-log       EXISTS — $(find "$BRAIN/nexus/run-log" -name '*.json' | wc -l) json file(s)"
          else
            out "run-log       MISSING — bootstrap-run-log mode will create it"
          fi
          if [ -f "$BRAIN/nexus/trust-scores.md" ]; then
            out "trust-scores  $(stat -c '%s bytes, mtime %y' "$BRAIN/nexus/trust-scores.md")"
          else
            out "trust-scores  missing"
          fi
          out '```'

          echo "status mode changed nothing."

      # The same canon diagnostics repair-install's preflight prints, minus every mutation: no
      # fetch (which would write remote refs into a checkout this mode promises not to touch), no
      # merge, no repair. `status` exists so a human can see the state BEFORE deciding to dispatch
      # a repair, and canon's state is half of what decides that — a repair-install dispatched
      # against a canon that does not exist cannot succeed, and the answer should not cost a run.
      - name: Report the canonical checkout state (read-only, no fetch)
        shell: bash
        run: |
          set +e
          set -uo pipefail
          CANON="$HOME/dev/AgentSystem"

          out() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          out ""
          out "### Canonical checkout \`$CANON\` (source for the brain-sync systemd unit)"
          out '```'
          CANON_EXISTS=no
          [ -e "$CANON" ] && CANON_EXISTS=yes
          out "canon exists       $CANON_EXISTS"

          CANON_IS_GIT=no
          if [ "$CANON_EXISTS" = yes ] && git -C "$CANON" rev-parse --git-dir >/dev/null 2>&1; then
            CANON_IS_GIT=yes
          fi
          out "canon is git       $CANON_IS_GIT"

          if [ "$CANON_IS_GIT" = yes ]; then
            out "canon branch       $(git -C "$CANON" rev-parse --abbrev-ref HEAD 2>/dev/null || echo '?')"
            out "canon HEAD         $(git -C "$CANON" log -1 --format='%h %ad %s' --date=iso 2>/dev/null || echo '?')"
            out "canon dirty paths  $(git -C "$CANON" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
            out "canon origin url   $(git -C "$CANON" remote get-url origin 2>/dev/null || echo '<no origin remote>')"
          fi

          if [ -f "$CANON/tools/brain-sync-run.js" ]; then
            out "brain-sync-run.js  present"
          else
            out "brain-sync-run.js  ABSENT — repair-install will refuse until this is true"
            out "                   (added by PR #341; absent usually means canon predates it)"
          fi
          out '```'
          out ""
          out "_No fetch was run against the canonical checkout: \`status\` mutates nothing, and even a"
          out "fetch writes remote refs. Dispatch \`repair-install\` for the bounded self-heal — fetch, a"
          out "return to \`main\` if canon is parked on another branch, then merge --ff-only; clean tree and"
          out "attached HEAD only, and the branch it leaves is never deleted._"

          echo "canon report changed nothing."

  # ── repair-brain ───────────────────────────────────────────────────────────────────────────
  #
  # The dangerous one. The runner's ~/agent-memory may hold commits that exist on NO other host —
  # per-agent decision logs, user preference nodes — and may be sitting mid-merge. So:
  #
  #   * tar the whole checkout INCLUDING .git before touching anything, so local commits are
  #     recoverable even if every later step is wrong;
  #   * resolve markers BEFORE any `git add`. That inversion is the entire fix: brain-sync.js runs
  #     `git add -A` before it pulls, so a half-merged tree is just file content to it and markers
  #     get committed and pushed as data (#344, 128 files);
  #   * reconcile with `git merge`, which keeps BOTH parents. A merge commit cannot lose a local
  #     commit; a reset can;
  #   * verify zero markers remain BEFORE pushing, so this run cannot be the one that publishes
  #     markers back to origin;
  #   * on anything that cannot be reconciled losslessly, STOP — raise a human-needed alert and
  #     exit nonzero. Forcing a resolution is the failure mode, not the fix.
  #
  # Banned outright, and absent from this file on purpose: `reset --hard`, `push --force`,
  # `checkout --theirs`, `clean -fd`. Every one of them can delete a fact that exists nowhere else.
  repair-brain:
    if: inputs.mode == 'repair-brain'
    runs-on: [self-hosted, Linux]
    permissions:
      issues: write
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      ALERT_KEY: runner-brain-repair-blocked
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Back up the whole brain checkout (including .git)
        shell: bash
        run: |
          set -euo pipefail
          BRAIN="$HOME/agent-memory"
          if [ ! -d "$BRAIN" ]; then
            echo "::error::$BRAIN does not exist on this host — nothing to repair"
            exit 1
          fi
          mkdir -p "$HOME/agent-memory-backups"
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="$HOME/agent-memory-backups/agent-memory-$STAMP.tar.gz"
          # .git is included deliberately. The local-only commits are the irreplaceable part, and
          # a backup of the working tree alone would not restore them.
          tar -czf "$BACKUP" -C "$HOME" agent-memory
          echo "BACKUP=$BACKUP" >> "$GITHUB_ENV"
          echo "backup written to $BACKUP ($(du -h "$BACKUP" | cut -f1))"
          ls -1t "$HOME/agent-memory-backups" | head -5

      - name: Reconcile, resolve markers, rebuild every graph
        shell: bash
        run: |
          set -uo pipefail
          BRAIN="$HOME/agent-memory"
          WS="$GITHUB_WORKSPACE"
          RESOLVER="$WS/tools/resolve-brain-markers.js"
          IDENT=(-c user.name='AgentSystem runner-maintenance' -c user.email='runner-maintenance@localhost')

          stop() {
            echo "::error::$1"
            echo "STOPPING. Nothing was force-resolved and nothing was pushed."
            echo "The brain is exactly as this step found it, apart from the marker repairs listed above."
            echo "Full pre-repair backup (working tree AND .git): ${BACKUP:-<not taken>}"
            exit 1
          }

          git -C "$BRAIN" rev-parse --git-dir >/dev/null 2>&1 || stop "$BRAIN is not a git checkout"
          GITDIR="$(git -C "$BRAIN" rev-parse --absolute-git-dir)"
          BRANCH="$(git -C "$BRAIN" rev-parse --abbrev-ref HEAD)"
          [ "$BRANCH" != "HEAD" ] || stop "the brain is on a detached HEAD — a human must decide what that state means"
          if [ -d "$GITDIR/rebase-merge" ] || [ -d "$GITDIR/rebase-apply" ]; then
            stop "a rebase is in progress in $BRAIN — this job will not rewrite history it did not start"
          fi

          rebuild_graphs() {
            local dir slug rc=0
            for dir in "$BRAIN"/nexus/*/; do
              [ -d "$dir" ] || continue
              dir="${dir%/}"
              slug="$(basename "$dir")"
              { [ -d "$dir/nodes" ] || [ -f "$dir/graph.json" ]; } || continue
              echo "--- rebuilding graph for $slug"
              # --brain-path, NOT the positional `graph-init.js <slug> <path>` form. The positional
              # form treats the brain as a repo root, writes to nexus/<slug>/nexus/<slug>/graph.json
              # — a brain nested inside the brain — and prints a success line for work it did not
              # do (#346). The arrow in its output is relative, so the two forms are
              # indistinguishable from the log alone.
              node "$WS/tools/graph/graph-init.js" "$slug" --brain-path="$dir" || rc=1
            done
            return $rc
          }

          echo "=== 1. fetch (updates remote refs only; the working tree is untouched)"
          git -C "$BRAIN" fetch --quiet origin || stop "git fetch failed — cannot reconcile without origin"

          if [ -f "$GITDIR/MERGE_HEAD" ]; then
            echo "=== 2. the brain is MID-MERGE — completing it, which preserves both parents"
            node "$RESOLVER" --root="$BRAIN" || stop "could not resolve the in-progress merge losslessly"
            rebuild_graphs || stop "graph rebuild failed while completing the in-progress merge"
            git -C "$BRAIN" add -A
            git -C "$BRAIN" "${IDENT[@]}" commit --quiet --no-edit \
              || stop "could not commit the in-progress merge"
          else
            echo "=== 2. no merge in progress"
          fi

          echo "=== 3. resolve committed markers BEFORE any git add (the #344 inversion)"
          node "$RESOLVER" --root="$BRAIN" || stop "the marker repair could not resolve every file — see UNRESOLVED lines above"
          rebuild_graphs || stop "graph rebuild failed after the marker repair"

          if [ -n "$(git -C "$BRAIN" status --porcelain)" ]; then
            git -C "$BRAIN" add -A
            git -C "$BRAIN" "${IDENT[@]}" commit --quiet \
              -m "chore(brain): resolve conflict markers and rebuild graphs on $(hostname)" \
              || stop "could not commit the repaired tree"
            echo "committed the repaired tree"
          else
            echo "nothing to commit — the tree was already clean"
          fi

          echo "=== 4. merge origin/$BRANCH (a merge keeps both parents; local-only commits survive)"
          MERGE_RC=0
          git -C "$BRAIN" "${IDENT[@]}" merge --no-edit origin/"$BRANCH" || MERGE_RC=$?
          if [ "$MERGE_RC" -ne 0 ]; then
            echo "the merge conflicted — resolving with the lossless rules"
            if ! node "$RESOLVER" --root="$BRAIN"; then
              git -C "$BRAIN" merge --abort || true
              stop "the merge could not be resolved losslessly — aborted it and left the brain as found"
            fi
            if ! rebuild_graphs; then
              git -C "$BRAIN" merge --abort || true
              stop "graph rebuild failed mid-merge — aborted the merge and left the brain as found"
            fi
            git -C "$BRAIN" add -A
            git -C "$BRAIN" "${IDENT[@]}" commit --quiet --no-edit || stop "could not commit the merge resolution"
          fi

          echo "=== 5. prove zero markers remain BEFORE anything is pushed"
          if ! node "$RESOLVER" --root="$BRAIN" --check; then
            stop "conflict markers are STILL present after the repair — refusing to push them to origin"
          fi

          echo "=== 6. push via brain-sync.js (plain push; never --force)"
          node "$WS/tools/brain-sync.js" || stop "brain-sync failed — the repair is committed locally but not pushed"

          echo "=== 7. prove the repair by running the job that was failing"
          node "$WS/tools/memory-decay.js" --all || stop "memory-decay still fails against the repaired brain"

          echo "=== 8. push whatever the decay pass changed"
          node "$WS/tools/brain-sync.js" || stop "brain-sync failed after the decay pass"

          echo "repair-brain completed. Backup retained at ${BACKUP:-<not taken>}"

      - name: Post-repair status
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          BRAIN="$HOME/agent-memory"
          git -C "$BRAIN" log --oneline -5 2>/dev/null || true
          git -C "$BRAIN" status --porcelain 2>/dev/null | head -20 || true
          node "$GITHUB_WORKSPACE/tools/resolve-brain-markers.js" --root="$BRAIN" --check --quiet || true

      - name: Clear the human-needed alert
        if: success()
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/tools/human-needed.js" resolve "$ALERT_KEY" \
            --comment "runner-maintenance repair-brain completed on $(hostname) at $(date -u +%Y-%m-%dT%H:%M:%SZ). Markers are gone, graphs rebuilt, memory-decay --all passes." \
            || echo "::warning::could not clear the human-needed alert"

      - name: Raise the human-needed alert (repair stopped)
        if: failure()
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/tools/human-needed.js" raise "$ALERT_KEY" \
            --title "[Infra]: the runner's agent-memory could not be repaired automatically" \
            --why "\`runner-maintenance.yml\` (mode repair-brain) stopped on \`$(hostname)\` rather than force a resolution. See [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Stopping is the designed outcome when the brain cannot be reconciled losslessly — the runner may hold commits that exist on no other host, so a forced resolution would destroy facts permanently. A pre-repair backup of the whole checkout, .git included, was written to \`~/agent-memory-backups/\` on that host." \
            --action "Read the run log for the \`stop\` reason. Dispatch \`gh workflow run runner-maintenance.yml -f mode=status\` for the current state. Detached HEAD or an in-progress rebase means a human must decide what that state was meant to be. UNRESOLVED lines from resolve-brain-markers.js name the exact files whose conflicts neither rule could resolve; for a graph.json that means rebuilding it from nodes/ with \`node tools/graph/graph-init.js <slug> --brain-path=\\\"\$HOME/agent-memory/nexus/<slug>\\\"\` (the --brain-path form, per #346). This issue closes itself on the next successful repair." \
            || echo "::warning::could not raise the human-needed alert"

  # ── bootstrap-run-log ──────────────────────────────────────────────────────────────────────
  #
  # weekly-trust-scores is red because ~/agent-memory/nexus/run-log/ has never existed on this
  # host, and compute-trust-scores.js refuses to overwrite trust-scores.md with an empty report
  # when its input is missing (#314 — no input is a broken pipeline, not an empty result). That
  # refusal is the tool working. --allow-empty is its documented one-time bootstrap escape hatch,
  # and it still refuses when trust-scores.md holds real data, so it cannot re-create the false
  # green it replaced.
  bootstrap-run-log:
    if: inputs.mode == 'bootstrap-run-log'
    runs-on: [self-hosted, Linux]
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create the run-log directory
        shell: bash
        run: |
          set -euo pipefail
          DIR="$HOME/agent-memory/nexus/run-log"
          if [ -d "$DIR" ]; then
            echo "$DIR already exists — $(find "$DIR" -name '*.json' | wc -l) json file(s), nothing to do"
          else
            mkdir -p "$DIR"
            echo "created $DIR"
          fi
          # A .gitkeep so the directory survives the round trip through git, which does not track
          # empty directories. Without it the next clone of the brain is back to square one.
          [ -f "$DIR/.gitkeep" ] || printf '%s\n' \
            "Run logs land here, written by the dispatch job in agent-dispatch.yml." > "$DIR/.gitkeep"

      - name: Compute trust scores once with --allow-empty
        shell: bash
        run: node "$GITHUB_WORKSPACE/tools/compute-trust-scores.js" --allow-empty

      - name: Push the bootstrap into the brain repo
        shell: bash
        run: node "$GITHUB_WORKSPACE/tools/brain-sync.js"

  # ── repair-install ─────────────────────────────────────────────────────────────────────────
  #
  # The other half of #352. `enforcement-drift-check.yml` runs four --check tools daily and, on
  # 2026-08-09 (run 31337967555), reported 5 drifted hook files, 3 missing registrations, 4
  # drifted agent definitions and both brain-sync units absent. Every one of those is repaired by
  # re-running the deployer that produced them — but there is no shell on this host (see the
  # header), so the repair had no channel. This mode is that channel.
  #
  # It writes to ~/.claude/{hooks,agents} and ~/.config/systemd/user ONLY. It does not write, sync,
  # commit or push ~/agent-memory — brain-sync.js is deliberately absent from this job — and it
  # proves that at the end by comparing the brain's HEAD before and after.
  #
  # ── Why two different repo roots, which is NOT a mistake ─────────────────────────────────────
  #
  # deploy-hooks.js and sync-agents.js run from $GITHUB_WORKSPACE. They copy files INTO
  # ~/.claude and register commands whose paths point inside ~/.claude, so nothing
  # workspace-relative is ever baked into the installed state, and the fresh checkout is exactly
  # the source of truth we want them reading.
  #
  # install-brain-sync-timer.sh runs from the CANONICAL checkout $HOME/dev/AgentSystem instead.
  # That script derives REPO_ROOT from its own BASH_SOURCE directory and bakes it into the unit's
  # `ExecStart=` and `WorkingDirectory=`. Installing it from the runner workspace would write a
  # unit pointing at a transient path that actions/checkout rewrites on the next run — precisely
  # the stale-unit failure its own --check exists to catch ("a task pointing at a moved or deleted
  # checkout, which looks perfectly healthy in systemctl status"). If the canonical checkout is
  # missing, this job FAILS rather than falling back; a silent fallback is how you install a timer
  # that reports healthy and never runs.
  #
  # ── Why the preflight prints before it decides, and heals within a hard boundary ──────────────
  #
  # The first repair-install dispatch (run 31338981940) died in the preflight with "brain-sync-run.js
  # is missing, so the canonical checkout is not usable", and every echo describing the canon sat
  # BELOW that fatal check. So the run proved the file was absent and said nothing about WHY —
  # missing directory, not a git checkout, wrong remote, or (the likely answer) a clone predating
  # PR #341, which is what added tools/brain-sync-run.js. Three very different human actions, no
  # evidence to choose between them. Evidence first, verdict second: the diagnostics below are
  # unconditional and run before anything can exit.
  #
  # The stale-clone case is also the one this job can fix itself, so in repair-install mode ONLY it
  # does — inside a boundary chosen so it can never destroy work:
  #
  #   * ONLY when canon is a git checkout with ZERO dirty paths. A working tree a person may be
  #     mid-edit in is not something a dispatched job gets to rewrite.
  #   * ONLY `fetch` + (if needed) `checkout main` + `merge --ff-only`. `reset --hard`,
  #     `checkout --`, `clean -fd`, `stash` and every force flag are absent on purpose, exactly as
  #     in repair-brain: none of the commands used here can make a commit unreachable.
  #   * Canon may be on ANOTHER BRANCH and still be healed, because that is the state run
  #     31339872073 actually found: a clean checkout parked on `issue-348-brain-sync-merge-guard`,
  #     whose work is already squash-merged into main, missing tools/brain-sync-run.js only because
  #     the branch was cut before #341 landed. Refusing that was a paper boundary — nothing was at
  #     risk and the host stayed broken. So a clean, attached checkout is returned to `main` first
  #     (`fetch origin main`, then `checkout main`, or `checkout -B main --track origin/main` when
  #     no local `main` exists yet), then fast-forwarded as before.
  #   * The branch it left is NEVER deleted. Its ref keeps every commit on it reachable, which is
  #     exactly what makes the switch non-destructive; the commits `origin/main..HEAD` are printed
  #     BEFORE the switch so the evidence survives it and a human can `git checkout` straight back.
  #   * A DETACHED HEAD is REFUSED with its own message and never switched away from: there is no
  #     ref holding those commits, so switching would make them reachable from nothing. That is the
  #     one case where "return canon to main" would destroy work, so it is the one case excluded.
  #   * On any other state — dirty, detached, not a checkout, or an ff-only that refuses because
  #     canon has diverged — it prints precisely which and stops for a human. It does not escalate
  #     to a stronger command.
  #
  # This is CODE only. ~/agent-memory is untouched by the heal, as it is by the rest of this job.
  # `status` mode carries the same diagnostics with no fetch, no checkout and no merge at all, so a
  # human can read canon's state without dispatching a repair.
  #
  # The --check invocations, by contrast, all run from the workspace, matching
  # enforcement-drift-check.yml exactly — so a green AFTER here is a direct prediction that
  # tomorrow's daily check is green. That is safe because --check asserts the units by MEANING
  # (the ExecStart script exists on disk, SuccessExitStatus is intact, the timer repeats), not by
  # byte-equality against the path the caller happens to sit in.
  #
  # Note: sync-agents.js writes .agents/sync.log, which is tracked, so this dirties the WORKSPACE
  # checkout. That is harmless and expected — actions/checkout cleans it on the next run, and
  # nothing here commits or pushes. Don't go looking for a bug when you see it.
  repair-install:
    if: inputs.mode == 'repair-install'
    runs-on: [self-hosted, Linux]
    # Read-only token: this job makes no API writes at all. No gh pr/issue calls, no git push.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The runner's service context has no PATH for node (the sibling jobs' bare `node` calls only
      # work by luck of the current install). Resolve it absolutely, same pattern as
      # enforcement-drift-check.yml.
      - name: Resolve node's absolute path for the runner service context
        id: tools
        shell: bash
        run: |
          resolve() {
            local name="$1"; shift
            local c
            for c in "$@"; do [ -x "$c" ] && { echo "$c"; return; }; done
            command -v "$name" 2>/dev/null || true
          }
          NODE_PATH=$(resolve node "$HOME/.nvm/versions/node/*/bin/node" /usr/bin/node /usr/local/bin/node)
          echo "Resolved node: $NODE_PATH"
          echo "node_path=$NODE_PATH" >> "$GITHUB_OUTPUT"

      - name: Preflight — diagnose the canonical checkout, then heal it within a hard boundary
        id: pre
        shell: bash
        run: |
          # `set +e` first and deliberately, same reason as the BEFORE step: GitHub invokes this as
          # `bash -e -o pipefail`, and under that inherited -e the FIRST probe to exit nonzero — a
          # `git -C` against a path that is not a checkout is the obvious one — would kill the step
          # mid-diagnosis. That is precisely the evidence-free failure this step was rewritten to
          # end. Every verdict below is an explicit `fatal`, never an incidental exit code.
          set +e
          set -uo pipefail
          NODE='${{ steps.tools.outputs.node_path }}'
          CANON="$HOME/dev/AgentSystem"

          out() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          fatal() { echo "::error::$1"; exit 1; }

          # ── EVIDENCE ─────────────────────────────────────────────────────────────────────────
          # Unconditional and first. Nothing here may exit, so a failing preflight still leaves a
          # human enough to tell "no directory" from "stale clone" from "wrong remote".
          out "## repair-install preflight on $(hostname) at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          out ""
          out "### canonical checkout diagnostics (printed BEFORE any verdict)"
          out '```'
          out "node               ${NODE:-<unresolved>}"
          out "workspace          $GITHUB_WORKSPACE   (source for deploy-hooks + sync-agents)"
          out "canonical repo     $CANON   (source for the systemd unit)"

          CANON_EXISTS=no
          [ -e "$CANON" ] && CANON_EXISTS=yes
          out "canon exists       $CANON_EXISTS"

          CANON_IS_GIT=no
          if [ "$CANON_EXISTS" = yes ] && git -C "$CANON" rev-parse --git-dir >/dev/null 2>&1; then
            CANON_IS_GIT=yes
          fi
          out "canon is git       $CANON_IS_GIT"

          CANON_BRANCH='?'
          CANON_DIRTY='?'
          CANON_ORIGIN='<unknown>'
          if [ "$CANON_IS_GIT" = yes ]; then
            CANON_BRANCH="$(git -C "$CANON" rev-parse --abbrev-ref HEAD 2>/dev/null || echo '?')"
            CANON_DIRTY="$(git -C "$CANON" status --porcelain 2>/dev/null | wc -l | tr -d ' ')"
            CANON_ORIGIN="$(git -C "$CANON" remote get-url origin 2>/dev/null || echo '<no origin remote>')"
            out "canon branch       $CANON_BRANCH"
            out "canon HEAD         $(git -C "$CANON" log -1 --format='%h %ad %s' --date=iso 2>/dev/null || echo '?')"
            out "canon dirty paths  $CANON_DIRTY"
            out "canon origin url   $CANON_ORIGIN"
          fi

          SYNC_RUN=absent
          [ -f "$CANON/tools/brain-sync-run.js" ] && SYNC_RUN=present
          out "brain-sync-run.js  $SYNC_RUN   (tools/brain-sync-run.js, added by PR #341)"
          out '```'

          # ── VERDICTS ─────────────────────────────────────────────────────────────────────────
          if [ -z "$NODE" ] || [ ! -x "$NODE" ]; then
            fatal "could not resolve a node binary on this runner; every step below needs one"
          fi

          if [ "$CANON_EXISTS" != yes ]; then
            fatal "$CANON does not exist on this host at all — this is not a stale clone, there is nothing there. install-brain-sync-timer.sh bakes its own directory into the unit ExecStart=, and this job will NOT fall back to the runner workspace, whose path actions/checkout rewrites every run. Clone the repo to $CANON on this host, then re-dispatch repair-install."
          fi

          if [ "$CANON_IS_GIT" != yes ]; then
            fatal "$CANON exists but is not a git checkout, so this job cannot update it and will not guess what it is. Inspect it on the host; if it is a stray directory, move it aside and clone the repo to $CANON, then re-dispatch repair-install."
          fi

          # ── SELF-HEAL (bounded) ──────────────────────────────────────────────────────────────
          # Clean tree only; fetch, an optional `checkout main`, then ff-only. See the job header
          # for why the boundary is drawn exactly here. No reset, no `checkout --`, no clean, no
          # stash, no force — none of the commands used below can make a commit unreachable. A
          # clean checkout parked on another branch IS returned to main, and the branch it leaves
          # is never deleted, so its commits stay reachable from that ref; the commits it holds
          # over origin/main are printed BEFORE the switch so the evidence survives it. A DETACHED
          # HEAD is refused instead, because there no ref would hold them. Code only:
          # ~/agent-memory is not involved.
          out ""
          out "### canon self-heal — fetch + (return to \`main\`) + merge --ff-only (clean tree only)"
          out '```'
          HEALED=skipped
          HEAL_WHY=""
          if [ "$CANON_DIRTY" != "0" ]; then
            HEAL_WHY="canon has $CANON_DIRTY dirty path(s); someone may be mid-edit"
            out "SKIPPED — $HEAL_WHY. Rewriting that tree from a dispatch is not acceptable."
            git -C "$CANON" status --porcelain 2>/dev/null | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$CANON_BRANCH" = "HEAD" ] || [ "$CANON_BRANCH" = "?" ]; then
            HEALED=refused-detached
            HEAL_WHY="canon is on a DETACHED HEAD, not a named local branch"
            out "REFUSED — $HEAL_WHY. Switching away would leave the commits at that HEAD reachable from no ref at all, and this job will never do that. On the host, either give them a branch (git -C $CANON switch -c <name>) or check main out by hand, then re-dispatch repair-install."
          else
            out "HEAD before   $(git -C "$CANON" log -1 --format='%h %ad %s' --date=iso 2>/dev/null)"
            FETCH_OUT="$(git -C "$CANON" fetch --quiet origin main 2>&1)"; FETCH_RC=$?
            [ -n "$FETCH_OUT" ] && out "$FETCH_OUT"
            if [ "$FETCH_RC" -ne 0 ]; then
              HEALED=failed
              HEAL_WHY="git fetch origin main failed in $CANON (exit $FETCH_RC) — no network, no credentials, or origin ($CANON_ORIGIN) is unreachable from this host"
              out "FAILED — $HEAL_WHY"
            else
              # Return to main first, if canon is parked elsewhere. Evidence before verdict: the
              # commits this branch holds over the freshly fetched origin/main are printed while
              # HEAD still points at them. The branch ref is left in place, so `git checkout
              # $CANON_BRANCH` on the host restores exactly this state.
              SWITCHED=no
              if [ "$CANON_BRANCH" != "main" ]; then
                out ""
                out "canon is on branch '$CANON_BRANCH', not main — returning it to main."
                out "commits on '$CANON_BRANCH' that are NOT on origin/main (kept; the branch is NOT deleted):"
                AHEAD_LOG="$(git -C "$CANON" log --oneline origin/main..HEAD 2>/dev/null | head -20)"
                if [ -n "$AHEAD_LOG" ]; then
                  printf '%s\n' "$AHEAD_LOG" | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  out "  (none — '$CANON_BRANCH' holds nothing that origin/main does not)"
                fi
                if git -C "$CANON" rev-parse --verify --quiet refs/heads/main >/dev/null 2>&1; then
                  # Plain checkout: it refuses rather than discarding anything, and the tree is
                  # already known clean. -B is NOT used here — on an existing local main it would
                  # move that ref and could orphan commits.
                  CO_OUT="$(git -C "$CANON" checkout main 2>&1)"; CO_RC=$?
                else
                  # No local main at all (a clone that only ever checked out this branch), so
                  # there is no ref for -B to move; it just creates main tracking origin/main.
                  CO_OUT="$(git -C "$CANON" checkout -B main --track origin/main 2>&1)"; CO_RC=$?
                fi
                [ -n "$CO_OUT" ] && out "$CO_OUT"
                if [ "$CO_RC" -ne 0 ]; then
                  HEALED=failed
                  HEAL_WHY="git checkout main refused in $CANON (exit $CO_RC) while returning it from '$CANON_BRANCH' — NOTHING was forced and the checkout was left on '$CANON_BRANCH'"
                  out "FAILED — $HEAL_WHY"
                else
                  SWITCHED=yes
                  out "OK — switched '$CANON_BRANCH' -> main. Branch '$CANON_BRANCH' still exists and still points at the commits above."
                fi
              fi
              if [ "$HEALED" != failed ]; then
                MERGE_OUT="$(git -C "$CANON" merge --ff-only origin/main 2>&1)"; MERGE_RC=$?
                [ -n "$MERGE_OUT" ] && out "$MERGE_OUT"
                if [ "$MERGE_RC" -ne 0 ]; then
                  HEALED=failed
                  HEAL_WHY="git merge --ff-only origin/main refused (exit $MERGE_RC) — canon has commits that are not on origin/main, so it cannot fast-forward. NOTHING was forced"
                  out "FAILED — $HEAL_WHY"
                elif [ "$SWITCHED" = yes ]; then
                  HEALED=yes-switched-to-main
                  out "OK — returned to main from '$CANON_BRANCH' and fast-forwarded (or already up to date)"
                else
                  HEALED=yes
                  out "OK — fast-forwarded (or already up to date)"
                fi
              fi
            fi
            out "HEAD after    $(git -C "$CANON" log -1 --format='%h %ad %s' --date=iso 2>/dev/null)"
            out "branch after  $(git -C "$CANON" rev-parse --abbrev-ref HEAD 2>/dev/null || echo '?')"
          fi
          out "result        $HEALED"
          out '```'

          # ── RE-TEST, only now ────────────────────────────────────────────────────────────────
          # A file still missing after a SUCCESSFUL ff-only pull is a categorically different fault
          # from a stale clone, and gets its own message so nobody re-runs the same repair twice.
          if [ ! -f "$CANON/tools/brain-sync-run.js" ]; then
            if [ "$HEALED" = yes ] || [ "$HEALED" = yes-switched-to-main ]; then
              fatal "the ff-only pull of $CANON SUCCEEDED and $CANON/tools/brain-sync-run.js is STILL missing. This is NOT a stale clone — a checkout in step with origin/main would have that file (PR #341). Something else is wrong with $CANON: its origin is '$CANON_ORIGIN' and may not be this repository, or it is a sparse/partial checkout that excludes tools/. Inspect it on the host and re-clone if it is the wrong repo, then re-dispatch repair-install."
            fi
            fatal "$CANON/tools/brain-sync-run.js is missing and the self-heal could not fix it: $HEAL_WHY. install-brain-sync-timer.sh bakes its own directory into the unit ExecStart=, and this job will NOT fall back to the runner workspace: that path is rewritten by actions/checkout, and the resulting unit would point at a directory that no longer exists while still looking healthy in systemctl status. Resolve the state above on the host by hand (the heal only ever runs fetch, an optional checkout of main, and merge --ff-only, and only on a clean tree with an attached HEAD, on purpose), then re-dispatch repair-install."
          fi

          out ""
          out "brain-sync-run.js present after preflight — proceeding."
          echo "canon_root=$CANON" >> "$GITHUB_OUTPUT"
          echo "canon_healed=$HEALED" >> "$GITHUB_OUTPUT"
          exit 0

      # ── BEFORE ───────────────────────────────────────────────────────────────────────────────
      # Nothing here may fail the job. The whole point is to photograph the drift that the repair
      # is about to fix, so an exit code from a --check tool is data, not an error.
      - name: BEFORE — fingerprint ~/agent-memory and run all four checks
        shell: bash
        run: |
          # set +e first and deliberately: GitHub invokes this as `bash --noprofile --norc -e -o
          # pipefail`, and a step's own `set -uo pipefail` does NOT clear that -e. Every --check
          # below is expected to exit nonzero right now; under the inherited -e the first one would
          # kill the step and the BEFORE picture would never be printed (tests/workflow_errexit).
          set +e
          set -uo pipefail
          NODE='${{ steps.tools.outputs.node_path }}'
          WS="$GITHUB_WORKSPACE"
          BRAIN="$HOME/agent-memory"

          out() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          run() { "$@" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; return "${PIPESTATUS[0]}"; }

          # Export the user bus if it exists, so the timer check's liveness half is genuinely
          # evaluated instead of reporting "cannot reach the user systemd bus" and passing.
          UID_N="$(id -u)"
          if [ -S "/run/user/$UID_N/bus" ]; then
            export XDG_RUNTIME_DIR="/run/user/$UID_N"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UID_N/bus"
          fi

          out "## repair-install on $(hostname) at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          out ""
          out "## BEFORE"
          out ""

          if git -C "$BRAIN" rev-parse HEAD >/dev/null 2>&1; then
            HEAD_B="$(git -C "$BRAIN" rev-parse HEAD)"
            DIRTY_B="$(git -C "$BRAIN" status --porcelain | wc -l | tr -d ' ')"
          else
            HEAD_B="none"
            DIRTY_B="n/a"
          fi
          echo "BRAIN_HEAD_BEFORE=$HEAD_B" >> "$GITHUB_ENV"
          echo "BRAIN_DIRTY_BEFORE=$DIRTY_B" >> "$GITHUB_ENV"
          out '```'
          out "agent-memory HEAD   $HEAD_B"
          out "agent-memory dirty  $DIRTY_B path(s)"
          out "(recorded so the AFTER step can prove this job did not touch the brain)"
          out '```'

          out ""
          out "### hooks — node tools/deploy-hooks.js --check --require-install"
          out '```'
          run "$NODE" "$WS/tools/deploy-hooks.js" --check --require-install
          out "exit $?"
          out '```'

          out ""
          out "### agents — node tools/sync-agents.js --check"
          out '```'
          run "$NODE" "$WS/tools/sync-agents.js" --check
          out "exit $?"
          out '```'

          out ""
          out "### timer — bash tools/install-brain-sync-timer.sh --check"
          out '```'
          run bash "$WS/tools/install-brain-sync-timer.sh" --check
          out "exit $?"
          out '```'

          out ""
          out "### routines — node tools/routines.js verify (INFORMATIONAL ONLY, see AFTER)"
          out '```'
          run "$NODE" "$WS/tools/routines.js" verify
          out "exit $?"
          out '```'

          echo "BEFORE recorded. Nothing has been changed yet."
          exit 0

      # ── ACTIONS ──────────────────────────────────────────────────────────────────────────────
      # Each of these three tools is idempotent: on an already-repaired host they report "no
      # changes" and exit 0, which is what makes a second dispatch of this mode a no-op.
      - name: ACTIONS — deploy hooks, sync agent defs, install the memory sync timer
        shell: bash
        run: |
          set +e
          set -uo pipefail
          NODE='${{ steps.tools.outputs.node_path }}'
          CANON='${{ steps.pre.outputs.canon_root }}'
          WS="$GITHUB_WORKSPACE"

          out() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          run() { "$@" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; return "${PIPESTATUS[0]}"; }
          rc=0

          out ""
          out "## ACTIONS"

          out ""
          out "### 1/3 node tools/deploy-hooks.js   (source: workspace)"
          out '```'
          run "$NODE" "$WS/tools/deploy-hooks.js"
          s=$?
          out "exit $s"
          out '```'
          if [ "$s" -ne 0 ]; then
            echo "::error::deploy-hooks.js failed with exit $s — hooks were not repaired"
            rc=1
          fi

          out ""
          out "### 2/3 node tools/sync-agents.js    (source: workspace; also writes the tracked .agents/sync.log)"
          out '```'
          run "$NODE" "$WS/tools/sync-agents.js"
          s=$?
          out "exit $s"
          out '```'
          if [ "$s" -ne 0 ]; then
            echo "::error::sync-agents.js failed with exit $s — agent definitions were not repaired"
            rc=1
          fi

          out ""
          out "### 3/3 bash tools/install-brain-sync-timer.sh   (source: CANONICAL checkout, not the workspace)"
          UID_N="$(id -u)"
          USER_N="$(id -un)"
          out '```'
          out "uid / user     $UID_N / $USER_N"
          out "installing from $CANON  (its path is baked into the unit ExecStart=)"

          # loginctl enable-linger is best effort and is what starts the user manager and creates
          # /run/user/<uid> in the first place. On a service account that has never logged in
          # interactively, its absence is usually WHY the bus below is unreachable.
          if loginctl enable-linger "$USER_N" >/dev/null 2>&1; then
            out "linger         enabled (or already enabled) for $USER_N"
          else
            out "linger         could NOT be enabled — best effort, continuing"
          fi

          if [ -S "/run/user/$UID_N/bus" ]; then
            export XDG_RUNTIME_DIR="/run/user/$UID_N"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UID_N/bus"
            out "user bus       /run/user/$UID_N/bus is a socket — exported XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS"
          else
            out "user bus       /run/user/$UID_N/bus is ABSENT — systemctl --user will not be reachable"
          fi

          # The unit bakes in whatever `command -v node` resolves to, falling back to /usr/bin/node.
          # The runner service context has no node on PATH, so without this the ExecStart= would be
          # written against a path that may not exist: an installed unit that can never run.
          export PATH="$(dirname "$NODE"):$PATH"
          out "node for unit  $(command -v node)"
          out '```'
          out '```'
          run bash "$CANON/tools/install-brain-sync-timer.sh"
          TIMER_RC=$?
          out "exit $TIMER_RC"
          out '```'
          echo "TIMER_RC=$TIMER_RC" >> "$GITHUB_ENV"
          echo "TIMER_USER=$USER_N" >> "$GITHUB_ENV"

          # Contract (tools/install-brain-sync-timer.sh header): 0 = units written AND the timer is
          # enabled and active. 4 = units written but the user bus was unreachable or `enable --now`
          # failed, so the timer is NOT running and only a human at a console can finish it.
          # Anything else = the units could not even be written.
          case "$TIMER_RC" in
            0)
              out ""
              out "timer installed and enabled. The AFTER step verifies it with --check, whose"
              out "liveness half must also pass."
              ;;
            4)
              out ""
              out "TIMER NOT RUNNING (exit 4). The units are on disk but were never enabled."
              out "The AFTER step proves the units landed with --check-units and then FAILS this job."
              ;;
            *)
              echo "::error::install-brain-sync-timer.sh exited $TIMER_RC — the units could not be written at all"
              rc=1
              ;;
          esac

          exit "$rc"

      # ── AFTER + VERDICT ──────────────────────────────────────────────────────────────────────
      #
      # Gated on the three things this mode actually repairs. `routines.js verify` runs too, but is
      # reported as INFORMATIONAL and does not gate: a routines/workflow mismatch is a repo-side
      # code change (an entry in config/routines.yml against a job in scheduled-tasks.yml), and
      # nothing this job runs on the host can fix one. Gating on it would leave repair-install
      # permanently red for a reason it is structurally unable to address, and a mode that is
      # always red is a mode nobody reads.
      - name: AFTER — re-run all four checks, prove the brain is untouched, then verdict
        if: always()
        shell: bash
        run: |
          set +e
          set -uo pipefail
          NODE='${{ steps.tools.outputs.node_path }}'
          WS="$GITHUB_WORKSPACE"
          BRAIN="$HOME/agent-memory"

          out() { printf '%s\n' "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          run() { "$@" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; return "${PIPESTATUS[0]}"; }
          gate=0

          UID_N="$(id -u)"
          if [ -S "/run/user/$UID_N/bus" ]; then
            export XDG_RUNTIME_DIR="/run/user/$UID_N"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UID_N/bus"
          fi

          out ""
          out "## AFTER"

          out ""
          out "### hooks — node tools/deploy-hooks.js --check --require-install   [GATING]"
          out '```'
          run "$NODE" "$WS/tools/deploy-hooks.js" --check --require-install
          s=$?
          out "exit $s"
          out '```'
          if [ "$s" -ne 0 ]; then
            echo "::error::hook drift is STILL present after running deploy-hooks.js"
            gate=1
          fi

          out ""
          out "### agents — node tools/sync-agents.js --check   [GATING]"
          out '```'
          run "$NODE" "$WS/tools/sync-agents.js" --check
          s=$?
          out "exit $s"
          out '```'
          if [ "$s" -ne 0 ]; then
            echo "::error::agent definition drift is STILL present after running sync-agents.js"
            gate=1
          fi

          out ""
          out "### timer — bash tools/install-brain-sync-timer.sh --check   [GATING]"
          out '```'
          run bash "$WS/tools/install-brain-sync-timer.sh" --check
          s=$?
          out "exit $s"
          out '```'
          if [ "$s" -ne 0 ]; then
            echo "::error::brain-sync timer drift is STILL present after running the installer"
            gate=1
          fi

          # Exit 4 from the installer means the units exist but nothing enabled them. Prove the
          # units really landed (--check-units skips the liveness half), then fail anyway. Reporting
          # success for a timer that is not scheduled is the exact false-green this mode exists to
          # end: on the host that matters, the 15-minute timer is the ONLY thing syncing the brain.
          if [ "${TIMER_RC:-0}" = "4" ]; then
            out ""
            out "### timer units on disk — --check-units (liveness half skipped)"
            out '```'
            run bash "$WS/tools/install-brain-sync-timer.sh" --check-units
            u=$?
            out "exit $u"
            out '```'
            if [ "$u" -ne 0 ]; then
              echo "::error::install-brain-sync-timer.sh exited 4 AND the units are not on disk — it wrote nothing usable"
            fi
            gate=1
            echo "::error::the memory sync timer is NOT running. The units were written to ~/.config/systemd/user/brain-sync.{service,timer} but the systemd --user bus was unreachable from the runner service context, so enable --now never happened. A human must run this at a console on $(hostname) as ${TIMER_USER:-the runner user}: loginctl enable-linger ${TIMER_USER:-<user>} && systemctl --user daemon-reload && systemctl --user enable --now brain-sync.timer"
            out ""
            out "HUMAN ACTION REQUIRED — run this at a console on $(hostname) as ${TIMER_USER:-the runner user}:"
            out '```'
            out "loginctl enable-linger ${TIMER_USER:-<user>} && systemctl --user daemon-reload && systemctl --user enable --now brain-sync.timer"
            out '```'
          fi

          out ""
          out "### routines — node tools/routines.js verify   [INFORMATIONAL ONLY — does not gate]"
          out "repair-install cannot fix a routines/workflow mismatch; that is a repo-side code change."
          out '```'
          run "$NODE" "$WS/tools/routines.js" verify
          s=$?
          out "exit $s   (not gating)"
          out '```'

          out ""
          out "### ~/agent-memory was not touched"
          if git -C "$BRAIN" rev-parse HEAD >/dev/null 2>&1; then
            HEAD_A="$(git -C "$BRAIN" rev-parse HEAD)"
            DIRTY_A="$(git -C "$BRAIN" status --porcelain | wc -l | tr -d ' ')"
          else
            HEAD_A="none"
            DIRTY_A="n/a"
          fi
          out '```'
          out "HEAD  before ${BRAIN_HEAD_BEFORE:-<not recorded>}"
          out "HEAD  after  $HEAD_A"
          out "dirty before ${BRAIN_DIRTY_BEFORE:-<not recorded>}"
          out "dirty after  $DIRTY_A"
          out '```'
          # No step in this job writes, commits, syncs or pushes the brain. But one thing it does is
          # `systemctl --user enable --now brain-sync.timer`, and that timer carries OnBootSec=2min
          # against a host booted long ago — so systemd elapses it AT ONCE and brain-sync-run.js
          # commits and pushes while this job is still running. On the successful repair path a
          # moved HEAD is therefore the expected outcome, not an anomaly.
          #
          # Gating on it would make the first successful repair-install — the dispatch this mode was
          # built for — go red for working correctly, and a mode that is red when it succeeds gets
          # its failures ignored. So: always print the commits, and gate only when TIMER_RC != 0,
          # i.e. when no timer was enabled and no benign mover exists.
          if [ "${BRAIN_HEAD_BEFORE:-}" != "$HEAD_A" ]; then
            out ""
            out "commits that landed while this job ran:"
            out '```'
            git -C "$BRAIN" log --oneline "${BRAIN_HEAD_BEFORE:-HEAD}..$HEAD_A" 2>&1 | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
            out '```'
            if [ "${TIMER_RC:-0}" = "0" ]; then
              out "EXPECTED: the timer this job enabled elapsed immediately (OnBootSec=2min, host booted long ago) and ran its first sync. Not a failure."
            else
              gate=1
              echo "::error::~/agent-memory HEAD moved during this job (${BRAIN_HEAD_BEFORE:-?} -> $HEAD_A) and TIMER_RC=${TIMER_RC:-?}, so the brain-sync timer was NOT enabled and cannot account for it. Nothing in this job writes the brain. Explain the commits above before trusting this run."
            fi
          fi

          out ""
          if [ "$gate" -eq 0 ]; then
            out "## VERDICT: PASS — hooks, agent definitions and the memory sync timer are all in sync on $(hostname). This job wrote nothing into ~/agent-memory; if its HEAD moved, the block above names the commits and the timer that produced them."
          else
            out "## VERDICT: FAIL — see the ::error:: annotations above. Re-read BEFORE vs AFTER to see what the repair did and did not move."
          fi
          exit "$gate"
