name: Sam Security Audit

# #164: Sam runs exactly ONCE per PR at merge-prep time, not once per push.
# - `opened` (non-draft only, see job `if:` below): a normal PR opened directly (not as a draft)
#   is ready immediately — without this, a non-draft PR that never gets the ready-to-merge label
#   or a draft->ready transition would merge un-audited.
# - `ready_for_review`: covers the draft->ready transition.
# - `labeled` is GONE (#228). It existed to let a human re-request an audit after addressing
#   feedback — but addressing feedback means pushing, and `synchronize` now covers that. Keeping it
#   had two costs and no benefit: with no job-level `if:` every routine label (`documentation`,
#   `priority:high`) would fire a full Claude audit plus a duplicate "ready to merge" comment, and
#   any label-triggered early-exit would emit a PASSING check that overwrites a blocking one for the
#   same SHA — reintroducing the bypass in a new shape. To force a re-audit without pushing, re-run
#   the workflow from the Actions UI. Nothing else in the repo reads `ready-to-merge`.
# `synchronize` IS a trigger as of #228, reversing the #164 decision above. Measured on PR #229:
# pushing a commit correctly left the PR BLOCKED (no check for the new SHA) — but adding ANY label
# then made the job skip, and GitHub counts a SKIPPED required check as SATISFIED, flipping the PR
# to CLEAN with nothing audited. Sequence: open -> push -> add any label -> merge unaudited. No
# `ready-to-merge` and no malice required; `documentation` does it.
# The fix has two halves and needs both: audit on every push (here), and never skip at job level
# (see the job `if:` below).
# #147: NO paths-ignore here. This job is a required status check on main — a workflow-level
# paths-ignore means docs-only PRs never produce the check at all, which makes them permanently
# unmergeable once branch protection requires it. Docs-only and spec PRs instead early-exit
# APPROVED inside the job (see the "Docs-only / spec precheck" step), so the required check
# still reports success without spending an audit run.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    branches: [main, dev]

# New push to branch cancels in-flight audit — re-runs fresh
concurrency:
  group: sam-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sam-audit:
    name: Security Audit (Sam CSO)
    # Linux self-hosted runner, co-located with Mission Control (installed via
    # tools/mission-control/install-runner.sh). Requires BOTH labels so only the
    # Linux runner picks this up — never a stray Windows runner.
    runs-on: [self-hosted, Linux]
    permissions:
      pull-requests: write
      contents: read
      # #295: the merge-ready ping reads the check rollup for the head SHA before claiming the PR
      # is ready. `checks: read` covers check runs (every workflow here), `statuses: read` covers
      # legacy commit statuses (external integrations). Drop either and that step loses the
      # ability to see part of the rollup — in which case it must say so rather than round the
      # missing half up to "passing", which is the entire defect being fixed.
      checks: read
      statuses: read
    # NO job-level `if:`. This is the crux of #228.
    #
    # The previous condition skipped the job for any event it did not recognise — a label that was
    # not `ready-to-merge`, a `synchronize`, a draft `opened`. The #147 comment assumed a skip
    # "produces no check run, which blocks merge". That is FALSE, and PR #229 measured it: a skipped
    # job produces a check run with conclusion `skipped`, and GitHub treats a skipped required check
    # as SATISFIED. So every skip path was an unlock, not a block.
    #
    # The job therefore always runs and always produces a real conclusion. Draft PRs and the
    # de-dupe that `if:` used to provide are handled INSIDE the job, in the precheck step, where an
    # early exit still emits a passing check run rather than a skipped one.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # #147: replaces workflow-level paths-ignore and job-level spec skip. Docs-only and
      # spec-labeled PRs get an APPROVED check without running the (expensive) Claude audit,
      # keeping the required status check green for them.
      - name: Draft / docs-only / spec precheck
        id: precheck
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            // Drafts are handled here rather than by a job-level `if:`. Skipping the job would
            // emit a `skipped` conclusion, which GitHub counts as a satisfied required check —
            // the #228 bypass. Exiting early here emits a real passing check instead, and the
            // audit fires for real on ready_for_review.
            // `approve` is deliberately narrower than `skip`. A skipped audit only needs to emit a
            // passing check; posting the approving review is what makes the PR mergeable through
            // pr-guard, and a draft must not carry that forward — the real audit on
            // ready_for_review may BLOCK, and an approval left over from draft state would sit in
            // the review list next to it (#271).
            core.setOutput('approve', 'false');
            if (pr.draft) {
              core.setOutput('skip', 'true');
              core.setOutput('skip_reason', 'draft PR — audit runs on ready_for_review');
              return;
            }
            const labels = pr.labels.map(l => l.name);
            if (labels.includes('spec')) {
              core.setOutput('skip', 'true');
              core.setOutput('approve', 'true');
              core.setOutput('skip_reason', 'spec-labeled PR (design/spec discussion, not mergeable code audit)');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const docsOnly = files.length > 0 && files.every(f =>
              f.filename.startsWith('docs/') || f.filename.endsWith('.md'));
            core.setOutput('skip', docsOnly ? 'true' : 'false');
            if (docsOnly) {
              core.setOutput('approve', 'true');
              core.setOutput('skip_reason', 'docs-only change (docs/** and *.md files only)');
            }

      - name: Pass check without audit (docs-only / spec)
        if: steps.precheck.outputs.skip == 'true'
        run: |
          echo "APPROVED without Claude audit: ${{ steps.precheck.outputs.skip_reason }}"

      # A green check is not an approval. pr-guard.js gates on an actual review from
      # github-actions[bot] whose body carries both "Sam (CSO)" and "APPROVED:", so the fast path
      # has to post one too — otherwise every docs-only PR passed CI and could never satisfy the
      # guard (#271). Same identity and same markers as the audited path below, so there stays
      # exactly one definition of "Sam approved this".
      - name: Post Sam approval without audit (docs-only / spec)
        if: steps.precheck.outputs.approve == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reason = ${{ toJSON(steps.precheck.outputs.skip_reason) }};
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: `✅ **Sam (CSO) — Automated Security Audit**\n\nAPPROVED: ${reason} — no model audit required.`,
              // COMMENT, not APPROVE: GitHub blocks the built-in GITHUB_TOKEN from approving PRs.
              event: 'COMMENT',
            });

      - name: Resolve gh/claude absolute paths for runner service context
        if: steps.precheck.outputs.skip != 'true'
        id: tools
        shell: bash
        # The self-hosted runner runs as a systemd service whose PATH does not
        # necessarily include ~/.local/bin (where the claude CLI usually lives).
        # Resolve absolute paths once and invoke by full path in later steps rather
        # than depending on the service PATH.
        run: |
          resolve() {
            local name="$1"; shift
            local c
            for c in "$@"; do [ -x "$c" ] && { echo "$c"; return; }; done
            command -v "$name" 2>/dev/null || true
          }
          GH_PATH=$(resolve gh "$HOME/.local/bin/gh" /usr/local/bin/gh /usr/bin/gh)
          CLAUDE_PATH=$(resolve claude "$HOME/.local/bin/claude" /usr/local/bin/claude /usr/bin/claude)
          NODE_PATH=$(resolve node "$HOME/.local/bin/node" /usr/local/bin/node /usr/bin/node)
          echo "Resolved gh: $GH_PATH"
          echo "Resolved claude: $CLAUDE_PATH"
          echo "Resolved node: $NODE_PATH"
          echo "gh_path=$GH_PATH" >> "$GITHUB_OUTPUT"
          echo "claude_path=$CLAUDE_PATH" >> "$GITHUB_OUTPUT"
          echo "node_path=$NODE_PATH" >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        if: steps.precheck.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          GH="${{ steps.tools.outputs.gh_path }}"
          echo "Using gh: $GH"
          "$GH" --version || true
          if ! "$GH" pr diff "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/pr-diff-full.txt"; then
            echo "gh pr diff failed"
            exit 1
          fi
          # #175: cap the diff at 4000 lines (was 400 — which silently dropped later
          # files and made Sam report them as "absent from the PR"). Mark truncation
          # explicitly so the auditor doesn't treat missing files as not-in-the-PR.
          total=$(wc -l < "$RUNNER_TEMP/pr-diff-full.txt")
          head -n 4000 "$RUNNER_TEMP/pr-diff-full.txt" > "$RUNNER_TEMP/pr-diff.txt"
          if [ "$total" -gt 4000 ]; then
            {
              echo ""
              echo "[DIFF TRUNCATED at 4000 of $total lines - files after this point are"
              echo "still part of this PR; do not treat them as absent.]"
            } >> "$RUNNER_TEMP/pr-diff.txt"
          fi

      # #337: skip the model entirely when this PR's merge-base diff is byte-identical to one
      # already given an APPROVED verdict — a rebase, a force-push that only reorders commits, or
      # a re-run triggered by something other than a content change all hash the same. Keyed on
      # (PR number, base ref, diff hash) — never the SHA — and only ever reuses an APPROVED prior
      # verdict; see tools/sam-audit-cache.js for the fail-toward-auditing rules this leans on.
      - name: Check diff-hash cache
        if: steps.precheck.outputs.skip != 'true'
        id: cache
        shell: bash
        # Emit plain string outputs (`reuse`, `reason`) rather than a JSON blob parsed later via
        # `fromJSON()` in an `if:` condition — GitHub Actions expressions are not guaranteed to
        # short-circuit `&&`, so a later step's `if:` referencing `fromJSON(steps.cache.outputs...)`
        # on a run where this step never executed (empty output) would error the whole job instead
        # of just skipping. Plain string comparisons never have that failure mode.
        run: |
          NODE="${{ steps.tools.outputs.node_path }}"
          RESULT=$("$NODE" "${{ github.workspace }}/tools/sam-audit-cache.js" check \
            --pr "${{ github.event.pull_request.number }}" \
            --base-ref "${{ github.base_ref }}" \
            --diff-file "$RUNNER_TEMP/pr-diff-full.txt")
          echo "cache check: $RESULT"
          REUSE=$("$NODE" -e "console.log(JSON.parse(process.argv[1]).reuse === true)" "$RESULT")
          REASON=$("$NODE" -e "console.log(JSON.parse(process.argv[1]).reason)" "$RESULT")
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Run Sam security audit
        if: steps.precheck.outputs.skip != 'true' && steps.cache.outputs.reuse != 'true'
        id: audit
        shell: bash
        # Untrusted PR title/branch values come in via env: (below), NEVER interpolated
        # into the script text — GitHub Actions expression substitution happens before the
        # shell sees the script, so a title with quotes/backticks/$(...) could otherwise
        # break or inject. Read them from $VAR in double quotes; the shell does not
        # re-evaluate variable *contents*.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -o pipefail
          CLAUDE="${{ steps.tools.outputs.claude_path }}"
          TASK="$RUNNER_TEMP/sam-task.txt"
          RESULT="$RUNNER_TEMP/sam-result.txt"
          {
            echo 'You are Sam (CSO). Run your pre-merge security audit on this pull request.'
            echo ''
            printf 'PR #%s: %s\n' "$PR_NUMBER" "$PR_TITLE"
            printf 'Base branch: %s\n' "$BASE_REF"
            printf 'Head branch: %s\n' "$HEAD_REF"
            echo ''
            echo '## Your 10-item Audit Checklist'
            echo '1. Data access patterns reviewed'
            echo '2. Auth/authz logic correct'
            echo '3. Credential handling secure (no secrets in diff)'
            echo '4. PHI exposure assessment'
            echo '5. Compliance with applicable standards'
            echo '6. Audit trail logging present'
            echo '7. Input validation at system boundaries'
            echo "8. Error messages don't leak sensitive data"
            echo '9. No secrets, API keys, or credentials in code/config'
            echo '10. Vendor contracts reviewed if new vendor with PHI'
            echo ''
            echo '## Diff'
            cat "$RUNNER_TEMP/pr-diff.txt"
            echo ''
            echo '## Required Output Format'
            echo 'Your FIRST LINE must be exactly one of (this is a machine-parsed marker — do not'
            echo 'compress, reword, or drop it):'
            echo '  APPROVED: <one-line summary of what was audited>'
            echo '  BLOCKED: <one-line reason for blocking>'
            echo ''
            echo 'Then list each checklist item result: PASS / FAIL / N/A with a brief note.'
            echo ''
            echo 'Critical rule: If you find ANY security issue that must be resolved before merge,'
            echo 'output BLOCKED: (not APPROVED:) as the FIRST LINE. Never approve a PR with unresolved'
            echo 'security findings. If BLOCKED, list each specific issue that must be resolved.'
            echo ''
            echo '## Response Style (#164 token diet)'
            echo 'Write the checklist and notes in caveman-compressed style: drop articles/filler'
            echo 'words, fragments are fine, no preamble or sign-off. Keep full technical substance --'
            echo 'every security finding, file/line reference, and required fix must still be'
            echo 'complete and precise. Do NOT compress the APPROVED:/BLOCKED: marker line itself or'
            echo 'any code/security finding text -- write those in normal, unambiguous language so'
            echo 'nothing is lost or misread.'
          } > "$TASK"
          echo "sam-task.txt length: $(wc -c < "$TASK")"
          # --agent Sam: run the real Sam agent definition (.agents/agents/sam.md), whose
          # "CI Pre-Merge Audit Mode" emits the APPROVED:/BLOCKED: vocabulary parsed below.
          # Agent names are case-sensitive (registered as `Sam`). Prompt is piped via stdin
          # (`-p` with no positional arg) to avoid argv length/quoting limits with a large diff.
          rc=0
          "$CLAUDE" --agent Sam --model sonnet --effort medium -p < "$TASK" > "$RESULT" 2>&1 || rc=$?
          echo "claude exit: $rc; result bytes: $(wc -c < "$RESULT")"
          # THREE states, not two. Every non-approval path used to collapse into `blocked`, so a
          # CLI spend-limit message, a network error or an empty result file got posted verbatim as
          # Sam's security finding under a 🚫 REQUEST_CHANGES review — PRs #327/#328 sat
          # "blocked for security" with nothing ever audited. `blocked` now requires the real
          # BLOCKED: marker; anything else is `error`. Both still fail the check (fail-closed is
          # correct); only the story they tell changes.
          if [ "$rc" -ne 0 ]; then
            status=error
          elif [ ! -s "$RESULT" ]; then
            status=error
          elif grep -q '^APPROVED:' "$RESULT"; then
            status=approved
          elif grep -q '^BLOCKED:' "$RESULT"; then
            status=blocked
          else
            status=error
          fi
          echo "verdict: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Post Sam review to PR
        id: review
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            // #337: a cache hit means the audit step was skipped on purpose (its `if:` excludes
            // this case), not that it failed — read the reuse verdict first, before falling
            // through to the real-audit-outcome logic below.
            const cacheReused = '${{ steps.cache.outputs.reuse }}' === 'true';
            const cacheReason = ${{ toJSON(steps.cache.outputs.reason) }};
            if (cacheReused) {
              core.setOutput('status', 'approved');
              const body = `✅ **Sam (CSO) — Automated Security Audit**\n\n`
                + `APPROVED: reusing prior verdict — ${cacheReason}\n\n`
                + `This PR's diff against \`${{ github.base_ref }}\` is byte-identical to the one `
                + `already audited and approved, so the model audit was skipped rather than `
                + `re-run. No new content to review since that verdict.`;
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: ${{ github.event.pull_request.number }},
                body,
                event: 'COMMENT',
              });
              return;
            }
            // `continue-on-error: true` on the audit step means a step that dies before writing its
            // outputs still lets this one run, with `status` empty. Treat outcome==failure and any
            // unrecognised value as `error` — never let an unset output fall through to the
            // "Sam blocked this PR" wording.
            const raw = '${{ steps.audit.outputs.status }}';
            const outcome = '${{ steps.audit.outcome }}';
            const status = (outcome !== 'failure' && (raw === 'approved' || raw === 'blocked'))
              ? raw
              : 'error';
            core.setOutput('status', status);
            let result = '';
            try {
              result = fs.readFileSync(process.env.RUNNER_TEMP + '/sam-result.txt', 'utf8');
            } catch (e) {
              result = 'Error reading Sam audit output: ' + e.message;
            }
            if (result.length > 60000) result = result.slice(0, 60000) + '\n\n...(truncated)';

            // An audit that could not run is an infrastructure outage, not a security finding.
            // Posting it as a REQUEST_CHANGES review says "Sam demands changes" about a spend
            // limit or a dead network — the same lie, relocated. Plain comment, distinct wording,
            // no 🚫. The check still fails (see the step below); only the story changes.
            if (status === 'error') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ github.event.pull_request.number }},
                body: `⚠️ **Sam (CSO) — Audit could not run**\n\n`
                  + `The security audit did not produce a verdict, so this PR is **unaudited** — `
                  + `not blocked on a finding. The check fails closed until the audit can run again.\n\n`
                  + `claude CLI exit code: \`${{ steps.audit.outputs.exit_code }}\`\n\n`
                  + `<details><summary>Captured output</summary>\n\n\`\`\`\n${result}\n\`\`\`\n\n</details>`,
              });
              return;
            }

            const emoji = status === 'approved' ? '✅' : '🚫';
            // GitHub hard-blocks the built-in GITHUB_TOKEN from submitting an APPROVE review
            // ("GitHub Actions is not permitted to approve pull requests") — this is a platform
            // restriction to stop workflows from rubber-stamping their own PRs, not a permissions
            // scope we can grant our way around. Use COMMENT for the approved case instead;
            // REQUEST_CHANGES (used for blocked) is not restricted. The PR body text still says
            // APPROVED/BLOCKED and the "ready to merge" comment step below still fires — human
            // merge approval (the actual gate) is unaffected.
            const event = status === 'approved' ? 'COMMENT' : 'REQUEST_CHANGES';

            // Submit as a formal GitHub review — branch protection can require it
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
              body: `${emoji} **Sam (CSO) — Automated Security Audit**\n\n${result}`,
              event: event,
            });

      # #337: only recorded after a genuine fresh audit approved — a reuse hit doesn't re-derive
      # anything new to cache, and skipping the write there avoids re-stamping the entry's
      # runId/auditedAt on every reused run for no benefit.
      - name: Record audit verdict in diff-hash cache
        if: steps.review.outputs.status == 'approved' && steps.cache.outputs.reuse != 'true'
        shell: bash
        run: |
          NODE="${{ steps.tools.outputs.node_path }}"
          "$NODE" "${{ github.workspace }}/tools/sam-audit-cache.js" record \
            --pr "${{ github.event.pull_request.number }}" \
            --base-ref "${{ github.base_ref }}" \
            --diff-file "$RUNNER_TEMP/pr-diff-full.txt" \
            --run-id "${{ github.run_id }}" \
            || echo "::warning::could not record the sam-audit-cache entry for PR ${{ github.event.pull_request.number }}"

      # #295: this step used to post a fixed sentence claiming both that tests were passing and
      # that the PR was ready to merge, from a condition that read `steps.audit.outputs.status`
      # and nothing else — no test check, no rollup. Observed live on PR #294: the ping appeared
      # while the required check `PR must be linked to an issue` was RED.
      #
      # This never bypassed anything — `/merge` is hard-gated by tools/pr-guard.js in
      # agent-dispatch.yml, which does read the checks — so the damage was to trust, not to the
      # gate: a confident wrong "ready to merge" teaches people to stop reading the check list,
      # which is the exact habit that let a dead workflow sit unnoticed for weeks (#275/#286).
      #
      # The step now reads the rollup and reports one of three states, and when it cannot read
      # the rollup it says only what it actually knows. Sam's verdict covers the security audit;
      # nothing here should imply more than that.
      - name: Post merge-ready ping (approved only)
        if: steps.review.outputs.status == 'approved'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            // This job's own check run is IN PROGRESS right now — it is the thing posting the
            // comment. Counting it would make every ping say "1 check still running" about
            // itself, forever. GitHub names a check run after the job's `name:`, so this string
            // must stay in step with the `name:` on the job above.
            const SELF = 'Security Audit (Sam CSO)';

            const approval = '✅ **Sam (CSO) approved** — the security audit passed.';
            let body;

            try {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, per_page: 100,
              });

              // One SHA can carry several runs of the same check (re-runs, or a run cancelled by
              // a `cancel-in-progress` concurrency group). Only the newest is the current
              // verdict; without this, a superseded cancelled attempt reads as a live failure.
              const current = new Map();
              for (const r of runs) {
                if (r.name === SELF) continue;
                const prev = current.get(r.name);
                if (!prev || r.id > prev.id) current.set(r.name, r);
              }

              const failing = [];
              const pending = [];
              for (const r of current.values()) {
                if (r.status !== 'completed') { pending.push(r.name); continue; }
                // `skipped` and `neutral` are deliberately NOT failures: GitHub counts both as
                // satisfying a required check (the #228 finding), so calling them failures here
                // would contradict the merge button and be wrong in the other direction.
                if (['failure', 'timed_out', 'action_required', 'cancelled', 'stale'].includes(r.conclusion)) {
                  failing.push(r.name);
                }
              }

              // Legacy commit statuses are a separate list from check runs and are equally
              // capable of blocking a merge, so a rollup that reads only check runs is the same
              // partial-evidence mistake in a smaller shape.
              const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              for (const s of combined.data.statuses || []) {
                if (s.state === 'failure' || s.state === 'error') failing.push(s.context);
                else if (s.state === 'pending') pending.push(s.context);
              }

              const list = names => [...new Set(names)].map(n => `\`${n}\``).join(', ');

              if (failing.length) {
                body = [
                  approval,
                  '',
                  `🚫 **Not ready to merge.** ${failing.length} other check(s) are not passing: ${list(failing)}.`,
                  '',
                  'Sam\'s approval covers the security audit only. `/merge` is gated on the full',
                  'check list by `pr-guard.js` and will refuse until these are green.',
                ].join('\n');
              } else if (pending.length) {
                body = [
                  approval,
                  '',
                  `⏳ ${pending.length} other check(s) are still running: ${list(pending)}.`,
                  '',
                  'Not yet ready to merge — check back when the check list settles.',
                ].join('\n');
              } else {
                body = [
                  approval,
                  '',
                  `All other checks on \`${sha.slice(0, 7)}\` are passing (${current.size} check(s) read).`,
                  '',
                  '**Ready to merge** — reply `/merge` to proceed or `/close` to abandon.',
                ].join('\n');
              }
            } catch (err) {
              // Say only what this step established. The audit really did pass; the check list
              // is simply unknown from here, and claiming it is green would be inventing the
              // evidence this whole change exists to stop inventing.
              core.warning(`Could not read the check rollup: ${err.message}`);
              body = [
                approval,
                '',
                `⚠️ Could not read the check rollup for this commit (${err.message}), so this`,
                'comment says nothing about the other checks. Read the check list yourself before',
                'merging — `/merge` will re-verify it and refuse if anything is red.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber, body,
            });

      - name: Fail check if blocked
        if: steps.review.outputs.status == 'blocked'
        run: |
          echo "Sam blocked this PR. See review for details."
          exit 1

      # Fail-closed, same as `blocked` — an audit that could not run must never let a PR through.
      # The difference is only that it says so honestly, and pages a human, because nothing on this
      # runner can fix a spend limit or a dead CLI.
      - name: Fail check and alert if the audit could not run
        if: steps.review.outputs.status == 'error'
        shell: bash
        # GH_TOKEN deliberately unset: human-needed.js needs issue-write, and the job's
        # GITHUB_TOKEN has none. Leaving it unset lets `gh` fall through to the runner's own
        # hosts.yml PAT (same #gh-token-shadow reasoning as scheduled-tasks.yml).
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          NODE="${{ steps.tools.outputs.node_path }}"
          "$NODE" "${{ github.workspace }}/tools/human-needed.js" raise sam-audit-cannot-run \
            --title "Sam pre-merge audit cannot run" \
            --why "\`sam-audit.yml\` could not produce a verdict on PR #${{ github.event.pull_request.number }} (claude CLI exit \`${{ steps.audit.outputs.exit_code }}\`). Every PR to \`main\` is unmergeable until this clears — the required check fails closed. See [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --action "Open the run log and read the captured claude output. Usual causes: Anthropic spend limit reached (raise it, or wait for the monthly reset), the \`claude\` CLI missing from the self-hosted runner's service PATH, or no network. Re-run the workflow from the Actions UI once fixed; a passing audit is what closes this alert." \
            || echo "::warning::could not raise the sam-audit-cannot-run alert"
          echo "Sam's audit could not run — failing closed. This PR is UNAUDITED, not blocked on a finding."
          exit 1

      - name: Clear the cannot-run alert once an audit completes
        if: steps.review.outputs.status == 'approved' || steps.review.outputs.status == 'blocked'
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          "${{ steps.tools.outputs.node_path }}" "${{ github.workspace }}/tools/human-needed.js" \
            resolve sam-audit-cannot-run \
            --comment "Sam produced a real verdict on PR #${{ github.event.pull_request.number }} — the audit path works again." \
            || echo "::warning::could not resolve the sam-audit-cannot-run alert"
