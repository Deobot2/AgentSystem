name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Run the exact command a developer runs. This step used to carry its own glob list,
      # which drifted from package.json and silently orphaned 10 test files from CI -- the
      # reason a dead workflow (#275) shipped past a green build. One source of truth now:
      # if a test runs locally it runs here, and adding a test file needs no CI edit.
      - name: Run all tests
        run: npm test

      # Deliberately NOT running `deploy-hooks.js --check` here. ubuntu-latest has no
      # ~/.claude/settings.json and no installed hooks, so it could only ever pass vacuously --
      # the same green-build-hides-a-dead-thing failure as #275/#292. Real drift needs a host
      # with hooks installed: the daily `enforcement-drift-check` job in enforcement-drift-check.yml.
